<!DOCTYPE html>
<html lang="es" dir="ltr" data-theme="auto" data-he-size="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Estudia vocabulario hebreo con repetición espaciada">
  <title>Ivrit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Nunito:wght@400;600;700&family=Heebo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* === 1. CSS VARIABLES (DESIGN.md §1) === */

    :root {
      /* Fondos y superficies */
      --bg:              #F7F3EC;
      --surface:         #FFFFFF;
      --surface-raised:  #FFFEF9;
      --surface-hover:   #F0EBE0;

      /* Azul israelí — escala completa */
      --blue-900: #002D6B;
      --blue-800: #003F8F;
      --blue-700: #0052B4;
      --blue-600: #1467C8;
      --blue-500: #3382D8;
      --blue-200: #A8C8F0;
      --blue-100: #D6E8FF;
      --blue-50:  #EEF5FF;

      /* Texto */
      --text-primary:    #1A1814;
      --text-secondary:  #5A5347;
      --text-muted:      #9E9489;
      --text-on-primary: #FFFFFF;

      /* Acento: oro mediterráneo */
      --gold:       #C87A0A;
      --gold-light: #F5C842;

      /* Feedback */
      --green:        #1A7A42;
      --green-light:  #DCFCE7;
      --green-bg:     #F0FBF4;
      --red:          #C42B2B;
      --red-light:    #FFE4E4;
      --red-bg:       #FFF5F5;
      --amber:        #C25A00;
      --amber-light:  #FFECD4;
      --amber-bg:     #FFF8F0;

      /* Bordes y sombras */
      --border:       #E2D9CC;
      --border-focus: var(--blue-700);
      --shadow-sm:    0 1px 3px rgba(26,24,20,.08), 0 1px 2px rgba(26,24,20,.04);
      --shadow-md:    0 4px 12px rgba(26,24,20,.10), 0 2px 6px rgba(26,24,20,.06);
      --shadow-lg:    0 8px 24px rgba(26,24,20,.12), 0 4px 12px rgba(26,24,20,.08);
      --shadow-flip:  0 16px 40px rgba(26,24,20,.18);

      /* Tipografía */
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'Nunito', 'Helvetica Neue', sans-serif;
      --font-hebrew:  'Heebo', 'Arial Hebrew', sans-serif;

      /* Radio de borde */
      --radius-sm:   6px;
      --radius-md:   12px;
      --radius-lg:   18px;
      --radius-xl:   24px;
      --radius-pill: 999px;

      /* Espaciado (base 4px) */
      --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
      --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

      /* Animaciones */
      --dur-fast:  150ms;
      --dur-base:  250ms;
      --dur-slow:  400ms;
      --ease-out:  cubic-bezier(.22,.68,0,1.2);
      --ease-flip: cubic-bezier(.45,0,.55,1);

      /* Escala de texto */
      --text-xs:      0.75rem;
      --text-sm:      0.875rem;
      --text-base:    1rem;
      --text-lg:      1.125rem;
      --text-xl:      1.25rem;
      --text-2xl:     1.5rem;
      --text-3xl:     1.875rem;
      --text-4xl:     2.25rem;
      --text-display: 3rem;

      /* Escala hebreo */
      --he-scale: 1.25;
    }

    /* Tema oscuro: media query automático (no anula si data-theme="light") */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:             #0D1520;
        --surface:        #152030;
        --surface-raised: #1C2A3E;
        --surface-hover:  #1F3048;

        --text-primary:   #EDE6D8;
        --text-secondary: #A09880;
        --text-muted:     #6A614F;

        --border:      #2A3D55;
        --shadow-sm:   0 1px 3px rgba(0,0,0,.30);
        --shadow-md:   0 4px 12px rgba(0,0,0,.40);
        --shadow-lg:   0 8px 24px rgba(0,0,0,.50);
        --shadow-flip: 0 16px 40px rgba(0,0,0,.60);

        --green-bg:  #0A2A18;
        --red-bg:    #2A0A0A;
        --amber-bg:  #2A1800;
        --blue-50:   #0A1828;
        --blue-100:  #102040;
      }
    }

    /* Tema oscuro explícito (data-theme="dark") */
    [data-theme="dark"] {
      --bg:             #0D1520;
      --surface:        #152030;
      --surface-raised: #1C2A3E;
      --surface-hover:  #1F3048;

      --text-primary:   #EDE6D8;
      --text-secondary: #A09880;
      --text-muted:     #6A614F;

      --border:      #2A3D55;
      --shadow-sm:   0 1px 3px rgba(0,0,0,.30);
      --shadow-md:   0 4px 12px rgba(0,0,0,.40);
      --shadow-lg:   0 8px 24px rgba(0,0,0,.50);
      --shadow-flip: 0 16px 40px rgba(0,0,0,.60);

      --green-bg:  #0A2A18;
      --red-bg:    #2A0A0A;
      --amber-bg:  #2A1800;
      --blue-50:   #0A1828;
      --blue-100:  #102040;
    }

    /* Tema claro explícito — fuerza light incluso si OS es oscuro */
    [data-theme="light"] {
      --bg:             #F7F3EC;
      --surface:        #FFFFFF;
      --surface-raised: #FFFEF9;
      --surface-hover:  #F0EBE0;

      --text-primary:   #1A1814;
      --text-secondary: #5A5347;
      --text-muted:     #9E9489;

      --border:      #E2D9CC;
      --shadow-sm:   0 1px 3px rgba(26,24,20,.08), 0 1px 2px rgba(26,24,20,.04);
      --shadow-md:   0 4px 12px rgba(26,24,20,.10), 0 2px 6px rgba(26,24,20,.06);
      --shadow-lg:   0 8px 24px rgba(26,24,20,.12), 0 4px 12px rgba(26,24,20,.08);
      --shadow-flip: 0 16px 40px rgba(26,24,20,.18);

      --green-bg:  #F0FBF4;
      --red-bg:    #FFF5F5;
      --amber-bg:  #FFF8F0;
      --blue-50:   #EEF5FF;
      --blue-100:  #D6E8FF;
    }

    /* Tamaños de hebreo configurables */
    :root[data-he-size="normal"]    { --he-scale: 1.25; }
    :root[data-he-size="grande"]    { --he-scale: 1.50; }
    :root[data-he-size="muy-grande"]{ --he-scale: 1.75; }


    /* === 2. RESET & BASE === */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--text-primary);
      background: var(--bg);
      min-height: 100vh;
      min-width: 360px;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }
    img, svg { display: block; }


    /* === 3. TIPOGRAFÍA === */

    /* Clase base para hebreo (DESIGN.md §2.3) */
    .he {
      font-family: var(--font-hebrew);
      font-size: calc(var(--he-scale) * 1em);
      direction: rtl;
      unicode-bidi: isolate;
      text-align: right;
    }

    /* Estilos tipográficos semánticos */
    .text-display {
      font-family: var(--font-display);
      font-size: var(--text-display);
      font-weight: 600;
      line-height: 1.1;
    }
    .text-heading {
      font-family: var(--font-display);
      font-size: 1.375rem;
      font-weight: 600;
      line-height: 1.2;
    }
    .text-body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 400;
    }
    .text-label {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
    }
    .text-micro {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 400;
    }
    .text-nav {
      font-family: var(--font-body);
      font-size: 0.6875rem;
      font-weight: 600;
    }
    .text-muted { color: var(--text-muted); }
    .text-secondary { color: var(--text-secondary); }


    /* === 4. LAYOUT === */

    .app-main {
      max-width: 720px;
      margin: 0 auto;
      padding: var(--sp-4);
      padding-bottom: calc(56px + env(safe-area-inset-bottom) + var(--sp-4));
      min-height: 100vh;
    }
    @media (min-width: 600px) {
      .app-main { padding: var(--sp-6); padding-bottom: calc(56px + env(safe-area-inset-bottom) + var(--sp-6)); }
    }

    /* Pantallas: ocultas por defecto, activas cuando router las muestra */
    .screen { display: none; }
    .screen.active { display: block; }


    /* === 5. BARRA INFERIOR (DESIGN.md §3.4) === */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(56px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      z-index: 100;
    }
    [data-theme="dark"] .bottom-nav {
      background: rgba(21,32,48,.92);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .bottom-nav {
        background: rgba(21,32,48,.92);
      }
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 44px;
      min-height: 44px;
      color: var(--text-muted);
      font: 600 0.6875rem var(--font-body);
      position: relative;
      transition: color var(--dur-fast);
    }
    /* Dot indicator (DESIGN.md §3.4) */
    .nav-item::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 4px;
      border-radius: 2px;
      background: var(--blue-700);
      transition: width 200ms ease;
    }
    .nav-item.active { color: var(--blue-700); }
    .nav-item.active::after { width: 4px; }
    .nav-item:hover { color: var(--text-secondary); }
    .nav-item svg { flex-shrink: 0; }


    /* === 6. CHIPS DE CAJA LEITNER (DESIGN.md §3.8) === */

    .box-chip {
      border-radius: var(--radius-sm);
      padding: 2px 7px;
      font: 600 var(--text-xs) var(--font-body);
      display: inline-block;
    }
    .box-chip[data-box="0"] { background: var(--border);      color: var(--text-muted); }
    .box-chip[data-box="1"] { background: #FFE4E4;             color: var(--red); }
    .box-chip[data-box="2"] { background: var(--amber-light);  color: var(--amber); }
    .box-chip[data-box="3"] { background: var(--blue-100);     color: var(--blue-700); }
    .box-chip[data-box="4"] { background: var(--green-light);  color: var(--green); }
    .box-chip[data-box="5"] { background: var(--gold-light);   color: var(--gold); }


    /* === 7. TOAST (DESIGN.md §3.9) === */

    #toast-container {
      position: fixed;
      bottom: calc(64px + env(safe-area-inset-bottom) + var(--sp-3));
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      align-items: center;
      pointer-events: none;
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: var(--sp-3) var(--sp-5);
      max-width: 360px;
      white-space: nowrap;
      pointer-events: auto;
      animation: toast-in 250ms var(--ease-out) both;
    }
    .toast.out { animation: toast-out 200ms ease-in forwards; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } }
    @keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }


    /* === 8. TRANSICIONES DE PANTALLA (DESIGN.md §4) === */

    .page-leave { animation: page-out 200ms ease-in forwards; }
    .page-enter { animation: page-in 250ms var(--ease-out) 80ms both; }
    @keyframes page-out { to { opacity: 0; transform: translateY(-6px); } }
    @keyframes page-in  { from { opacity: 0; transform: translateY(10px); } }

    @media (prefers-reduced-motion: reduce) {
      .page-leave { animation: page-out-reduced 200ms ease-in forwards; }
      .page-enter { animation: page-in-reduced 250ms var(--ease-out) 80ms both; }
      @keyframes page-out-reduced { to { opacity: 0; } }
      @keyframes page-in-reduced  { from { opacity: 0; } }

      /* También reducir otras animaciones */
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }


    /* === 9. ANIMACIONES DE FEEDBACK (DESIGN.md §3.6) === */

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15%     { transform: translateX(-7px); }
      30%     { transform: translateX(6px); }
      45%     { transform: translateX(-5px); }
      60%     { transform: translateX(4px); }
      75%     { transform: translateX(-2px); }
      90%     { transform: translateX(2px); }
    }
    @keyframes flash-green {
      0%,100% { background: transparent; }
      40%     { background: rgba(26,122,66,.12); }
    }
    @keyframes flash-red {
      0%,100% { background: transparent; }
      40%     { background: rgba(196,43,43,.10); }
    }


    /* === 10. COMPONENTES DE TARJETAS (DESIGN.md §3.1) === */

    /* Flip 3D */
    .card-scene { perspective: 900px; }
    .card { transform-style: preserve-3d; transition: transform var(--dur-slow) var(--ease-flip); }
    .card.flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .card-back { transform: rotateY(180deg); }

    /* Barra de progreso de sesión (DESIGN.md §3.7) */
    .session-progress {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--border);
      z-index: 100;
    }
    .session-progress-fill {
      height: 100%;
      background: var(--blue-700);
      border-radius: 0 2px 2px 0;
      transition: width 300ms var(--ease-out);
    }


    /* === 11. UTILIDADES === */

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
    }
    :focus-visible {
      outline: 2px solid var(--blue-600);
      outline-offset: 2px;
      border-radius: inherit;
    }
    .text-center { text-align: center; }
    .mt-4 { margin-top: var(--sp-4); }
    .mt-6 { margin-top: var(--sp-6); }
  </style>
</head>

  <!-- CONTENEDOR DE TOASTS -->
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

  <script>
    'use strict';

    /* === CONFIG === */
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmqmnYsJrX-ux2YE1TFzfwag76I1VDibe5hewXXa8O8sODnY6qjCdcYlg5dLgE7K2s/exec";

    /* === 1. APP OBJECT SCAFFOLD === */

    const App = {
      data:   {},  // normalize, load functions (Plan 02)
      state:  {
        vocab:      [],        // normalized word list (loaded Plan 02)
        progress:   {},        // Leitner progress by wordId (expanded Plan 05)
        settings:   { theme: 'auto', heSize: 'normal' },
        stats:      {},        // session stats (Plan 05)
        storageOk:  true       // false si localStorage no está disponible
      },
      router: {},  // navigate, current route (Plan 03)
      ui:     {}   // render functions, toast
    };

    App.init = async function() {
      App.ui.initTheme();
      await App.data.load();
      App.router.init();
    };


    /* === 2. HELPERS DE ALMACENAMIENTO === */

    const Store = {
      get(key) {
        try {
          const v = localStorage.getItem(key);
          return v ? JSON.parse(v) : null;
        } catch {
          App.state.storageOk = false;
          return null;
        }
      },
      set(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch {
          App.state.storageOk = false;
        }
      },
      remove(key) {
        try {
          localStorage.removeItem(key);
        } catch {
          App.state.storageOk = false;
        }
      }
    };


    /* === 3. SISTEMA DE TEMA === */

    /**
     * Aplica el tema visual.
     * @param {'auto'|'claro'|'oscuro'} theme
     */
    App.ui.applyTheme = function(theme) {
      const html = document.documentElement;
      if (theme === 'oscuro') {
        html.setAttribute('data-theme', 'dark');
      } else if (theme === 'claro') {
        html.setAttribute('data-theme', 'light');
      } else {
        // auto: eliminar atributo para que la media query decida
        html.removeAttribute('data-theme');
      }
      App.state.settings.theme = theme;
      Store.set('ivrit.v1.settings', App.state.settings);
    };

    App.ui.initTheme = function() {
      const saved = Store.get('ivrit.v1.settings') || {};
      const theme = saved.theme || 'auto';
      const heSize = saved.heSize || 'normal';
      // Restaurar heSize también
      document.documentElement.setAttribute('data-he-size', heSize);
      App.state.settings.heSize = heSize;
      // Aplicar tema (también persiste en settings)
      App.ui.applyTheme(theme);
    };


    /* === 4. UTILIDADES DE UI === */

    /**
     * Muestra un toast en la parte inferior.
     * @param {string} msg
     * @param {number} duration ms antes de cerrar (default 3000)
     */
    App.ui.showToast = function(msg, duration = 3000) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.getElementById('toast-container').appendChild(t);
      setTimeout(() => {
        t.classList.add('out');
        t.addEventListener('animationend', () => t.remove(), { once: true });
      }, duration);
    };


    /* === 5. DATOS: NORMALIZACIÓN Y CARGA === */

    /**
     * Mapeo encabezado hebreo → campo normalizado (SPEC §2.2).
     * Por texto, no por posición.
     */
    const HEADER_MAP = {
      'תרגום': 'es',
      'יחיד':  'msg',
      'רבים':  'mpl',
      'יחידה': 'fsg',
      'רבות':  'fpl',
      'פועל':  'msg',   // verbo infinitivo → msg
      'ביטוי': 'msg',   // expresión → msg
      'מדינה': 'msg',   // nombre de país → msg
      'אזור':  'group', // región (país)
      'תחום':  'group', // área (profesión)
    };

    /** Convierte una categoría en su kind según los encabezados (SPEC §2.3). */
    function detectKind(headerSet) {
      if (headerSet.has('פועל'))  return 'verb';
      if (headerSet.has('ביטוי')) return 'expr';
      if (headerSet.has('מדינה')) return 'country';
      if (headerSet.has('יחידה') || headerSet.has('רבות')) return 'gendered';
      return 'noun';
    }

    /** Convierte string a slug URL-safe (sin acentos, lowercase, guiones). */
    function slugify(str) {
      return String(str).normalize('NFD').replace(/[̀-ͯ]/g, '')
        .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    /**
     * Normaliza el JSON crudo de vocab.json → array de word objects (SPEC §2.2–2.4).
     * Función pura: no toca App.state.
     * @param {object} rawData — objeto con .categories[]
     * @returns {Array} words[]
     */
    App.data.normalize = function(rawData) {
      // Fusionar categorías con el mismo nombre (SPEC §2.1)
      const merged = [];
      const catIdx = {};
      for (const cat of rawData.categories) {
        if (catIdx[cat.name] !== undefined) {
          merged[catIdx[cat.name]].rows.push(...cat.rows);
        } else {
          catIdx[cat.name] = merged.length;
          merged.push({ name: cat.name, headers: cat.headers, rows: [...cat.rows] });
        }
      }

      const words = [];
      for (const cat of merged) {
        const catSlug  = slugify(cat.name);
        const headerSet = new Set(cat.headers);
        const kind      = detectKind(headerSet);
        const seenBase  = {};  // baseId → true, para detectar duplicados

        for (const row of cat.rows) {
          const word = {
            id: '', cat: cat.name, kind,
            es: '', msg: null, mpl: null, fsg: null, fpl: null, group: null, extra: {}
          };

          for (let i = 0; i < cat.headers.length; i++) {
            const header = cat.headers[i];
            const raw    = row[i];
            // "—" o vacío → null (SPEC §2.4)
            const val = (raw === '—' || raw === undefined || raw === null || String(raw).trim() === '')
              ? null : String(raw).trim();
            const field = HEADER_MAP[header];
            if (field) {
              word[field] = val;
            } else {
              word.extra[header] = val;
            }
          }

          // ID estable: slug(cat)::slug(es) [+ ::slug(msg) si hay duplicado] (SPEC §2.4)
          const baseId = catSlug + '::' + slugify(word.es || '');
          if (seenBase[baseId]) {
            word.id = baseId + '::' + slugify(word.msg || '');
          } else {
            word.id    = baseId;
            seenBase[baseId] = true;
          }

          words.push(word);
        }
      }
      return words;
    };

    /**
     * Carga vocab.json (o caché de localStorage si es más nueva),
     * normaliza y puebla App.state.vocab. (SPEC §3)
     */
    App.data.load = async function() {
      let raw = null;

      try {
        const resp = await fetch('./vocab.json');
        if (resp.ok) raw = await resp.json();
      } catch (_) { /* sin red / file:// — caerá a caché */ }

      const cache = Store.get('ivrit.v1.vocabCache');

      if (raw && cache && cache.updated && raw.updated && cache.updated >= raw.updated) {
        // Caché más nueva o igual → usar caché
        raw = cache.raw;
      } else if (raw) {
        // Archivo más nuevo → actualizar caché
        Store.set('ivrit.v1.vocabCache', { raw, updated: raw.updated || new Date().toISOString() });
      } else if (cache && cache.raw) {
        // Fetch falló, usar caché
        App.ui.showToast('Usando vocabulario guardado en caché');
        raw = cache.raw;
      } else {
        // Todo falló
        App.ui.showToast('No se pudo cargar el vocabulario');
        App.state.vocab = [];
        return;
      }

      try {
        App.state.vocab = App.data.normalize(raw);
      } catch (_) {
        App.ui.showToast('Error al procesar el vocabulario');
        App.state.vocab = [];
        return;
      }

      // Restaurar progreso y settings persistidos
      App.state.progress = Store.get('ivrit.v1.progress') || {};
      App.state.stats    = Store.get('ivrit.v1.stats')    || {};
      const saved = Store.get('ivrit.v1.settings') || {};
      Object.assign(App.state.settings, saved);
    };


    /* === 6. ROUTER === */

    App.router = {
      current: { route: 'inicio', params: {} },

      _parseHash(hash) {
        // '#/inicio?cat=Verbos' → { route: 'inicio', params: { cat: 'Verbos' } }
        const withoutHash = (hash || '#/inicio').replace(/^#\/?/, '');
        const [routePart, queryPart] = withoutHash.split('?');
        const route = routePart || 'inicio';
        const params = {};
        if (queryPart) {
          queryPart.split('&').forEach(pair => {
            const [k, v] = pair.split('=');
            if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
          });
        }
        return { route, params };
      },

      navigate(hash) {
        const parsed = App.router._parseHash(hash);
        App.router.current = parsed;

        // Update nav active state
        document.querySelectorAll('.nav-item').forEach(el => {
          const r = el.dataset.route;
          const studyRoutes = ['sesion','tarjetas','opcion-multiple','unir','completar','concordancia','escribir','clasificar','contrarreloj'];
          let active = false;
          if (r === 'sesion')        active = studyRoutes.includes(parsed.route);
          else if (r === 'estadisticas')  active = parsed.route === 'estadisticas';
          else if (r === 'configuracion') active = parsed.route === 'configuracion';
          else if (r === 'diccionario')   active = parsed.route === 'diccionario';
          else if (r === 'inicio')        active = parsed.route === 'inicio';
          el.classList.toggle('active', active);
        });

        // Page transition: add leave class to current content
        const main = document.getElementById('app-main');
        const existing = main.firstElementChild;
        if (existing) {
          existing.classList.add('page-leave');
          existing.addEventListener('animationend', () => {
            App.router._renderScreen(parsed, main);
          }, { once: true });
          // Fallback for reduced-motion (animation may not fire)
          setTimeout(() => {
            if (main.firstElementChild === existing) {
              App.router._renderScreen(parsed, main);
            }
          }, 250);
        } else {
          App.router._renderScreen(parsed, main);
        }
      },

      _renderScreen(parsed, main) {
        main.innerHTML = '';
        const screenEl = document.createElement('div');
        screenEl.className = 'screen active page-enter';

        const renderers = {
          inicio:      () => App.ui.renderInicio(screenEl),
          diccionario: () => App.ui.renderDiccionario(screenEl),
          sesion:      () => App.ui.renderSesion(screenEl),
        };

        const stubs = ['tarjetas','opcion-multiple','unir','completar','concordancia',
                       'escribir','clasificar','contrarreloj','estadisticas','configuracion'];
        if (renderers[parsed.route]) {
          renderers[parsed.route]();
        } else if (stubs.includes(parsed.route)) {
          App.ui.renderStub(screenEl, parsed.route);
        } else {
          App.ui.renderInicio(screenEl); // fallback
        }

        main.appendChild(screenEl);
      },

      init() {
        window.addEventListener('hashchange', () => {
          App.router.navigate(window.location.hash);
        });
        const hash = window.location.hash || '#/inicio';
        if (!window.location.hash) history.replaceState(null, '', '#/inicio');
        App.router.navigate(hash);
      }
    };

    // Stub renderer for unimplemented screens
    App.ui.renderStub = function(el, route) {

        'clasificar': 'Clasificar', 'contrarreloj': 'Contrarreloj',
        'estadisticas': 'Estadísticas', 'configuracion': 'Configuración'
      };
      el.innerHTML = `

          <p style="font: 600 var(--text-lg) var(--font-display); color: var(--text-secondary); margin-bottom: var(--sp-3);">${names[route] || route}</p>

    /* === 7b. SELECTOR DE SESIÓN (SPEC §4.2) === */

    App.ui.renderSesion = function(el) {
      // Build category order and counts from vocab
      const catOrder = [];
      const catCounts = {};
      for (const w of App.state.vocab) {
        if (!catCounts[w.cat]) { catOrder.push(w.cat); catCounts[w.cat] = 0; }
        catCounts[w.cat]++;
      }

      // Load last session from localStorage — validate all fields (T-05-01)
      const savedSettings = Store.get('ivrit.v1.settings') || {};
      const raw = (savedSettings.lastSession && typeof savedSettings.lastSession === 'object') ? savedSettings.lastSession : {};
      const VALID_FILTERS    = ['todas', 'nuevas', 'dificiles', 'hoy'];
      const VALID_DIRECTIONS = ['es-he', 'he-es', 'mezclada'];
      const VALID_QUANTITIES = [10, 20, 30, 0];
      const state = {
        cats:      (Array.isArray(raw.cats) && raw.cats.every(c => typeof c === 'string')) ? raw.cats : catOrder.slice(),
        filter:    VALID_FILTERS.includes(raw.filter)       ? raw.filter    : 'todas',
        direction: VALID_DIRECTIONS.includes(raw.direction) ? raw.direction : 'es-he',
        quantity:  VALID_QUANTITIES.includes(raw.quantity)  ? raw.quantity  : 10
      };

      function saveState() {
        const settings = Store.get('ivrit.v1.settings') || {};
        settings.lastSession = { cats: state.cats.slice(), filter: state.filter, direction: state.direction, quantity: state.quantity };
        Store.set('ivrit.v1.settings', settings);
      }

      function getMatchingWords() {
        const selected = state.cats.length === 0 ? catOrder : state.cats;
        let words = App.state.vocab.filter(w => selected.includes(w.cat));
        const now = Date.now();
        const sevenDaysAgo = now - 7 * 24 * 60 * 60 * 1000;
        if (state.filter === 'nuevas') {
          words = words.filter(w => !App.state.progress[w.id] || App.state.progress[w.id].box === 0);
        } else if (state.filter === 'dificiles') {
          words = words.filter(w => {
            const p = App.state.progress[w.id];
            if (!p) return true; // unstarted = box 0 = difícil
            return p.box <= 2 || (p.lastWrong && p.lastWrong >= sevenDaysAgo);
          });
        } else if (state.filter === 'hoy') {
          words = words.filter(w => {
            const p = App.state.progress[w.id];
            return p && p.box > 0 && p.due <= now;
          });
        }
        return words;
      }

      function rerender() {
        saveState();
        App.ui.renderSesion(el);
      }

      const matching = getMatchingWords();
      const qty = state.quantity === 0 ? matching.length : state.quantity;
      const hasEnough = matching.length >= Math.min(qty, 1);
      const isInsufficient = state.quantity !== 0 && matching.length < state.quantity && matching.length > 0;

      // Build chip HTML helper
      function chip(label, selected, onclick, extraStyle) {

        return `<button onclick="${onclick}" style="${style}" aria-pressed="${selected}">${label}</button>`;
      }

      el.innerHTML = `

                <button onclick="App.ui._sesionSelectAll()"
                  style="padding:4px 12px;border:1.5px solid var(--border);border-radius:var(--radius-pill);background:transparent;color:var(--text-secondary);font:600 var(--text-xs) var(--font-body);cursor:pointer;min-height:32px;transition:background var(--dur-fast);"
                  onmouseover="this.style.background='var(--blue-50)'" onmouseout="this.style.background='transparent'">Todas</button>
                <button onclick="App.ui._sesionSelectNone()"
                  style="padding:4px 12px;border:1.5px solid var(--border);border-radius:var(--radius-pill);background:transparent;color:var(--text-secondary);font:600 var(--text-xs) var(--font-body);cursor:pointer;min-height:32px;transition:background var(--dur-fast);"
                  onmouseover="this.style.background='var(--blue-50)'" onmouseout="this.style.background='transparent'">Ninguna</button>
              </div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:var(--sp-2);">
              ${catOrder.map(cat => {
                const sel = state.cats.includes(cat);
                // T-05-02: cat names from local vocab.json (trusted); apostrophes escaped
                const safecat = cat.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
                return `<button onclick="App.ui._sesionToggleCat('${safecat}')"
                  style="border-radius:var(--radius-pill);padding:6px 14px;font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:36px;transition:background var(--dur-fast),border-color var(--dur-fast);${sel?'background:var(--blue-700);color:#fff;border:1.5px solid transparent;':'background:transparent;color:var(--text-secondary);border:1.5px solid var(--border);'}"
                  aria-pressed="${sel}">
                  ${cat} <span style="opacity:.7;">${catCounts[cat]}</span>
                </button>`;
              }).join('')}
            </div>
          </section>

          <!-- Filter -->
          <section style="margin-bottom:var(--sp-5);">
            <h2 style="font:600 1.125rem var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-3);">Filtro</h2>
            <div style="display:flex;flex-wrap:wrap;gap:var(--sp-2);">
              ${[{val:'todas',label:'Todas'},{val:'nuevas',label:'Nuevas'},{val:'dificiles',label:'Difíciles'},{val:'hoy',label:'Para hoy'}].map(opt => {
                const sel = state.filter === opt.val;
                return `<button onclick="App.ui._sesionSetFilter('${opt.val}')"
                  style="border-radius:var(--radius-pill);padding:6px 14px;font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:36px;transition:background var(--dur-fast),border-color var(--dur-fast);${sel?'background:var(--blue-700);color:#fff;border:1.5px solid transparent;':'background:transparent;color:var(--text-secondary);border:1.5px solid var(--border);'}"
                  aria-pressed="${sel}">${opt.label}</button>`;
              }).join('')}
            </div>
          </section>

          <!-- Direction -->
          <section style="margin-bottom:var(--sp-5);">
            <h2 style="font:600 1.125rem var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-3);">Dirección</h2>
            <div style="display:flex;flex-wrap:wrap;gap:var(--sp-2);">
              ${[{val:'es-he',label:'ES → HE'},{val:'he-es',label:'HE → ES'},{val:'mezclada',label:'Mezclada'}].map(opt => {
                const sel = state.direction === opt.val;
                return `<button onclick="App.ui._sesionSetDirection('${opt.val}')"
                  style="border-radius:var(--radius-pill);padding:6px 14px;font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:36px;transition:background var(--dur-fast),border-color var(--dur-fast);${sel?'background:var(--blue-700);color:#fff;border:1.5px solid transparent;':'background:transparent;color:var(--text-secondary);border:1.5px solid var(--border);'}"
                  aria-pressed="${sel}">${opt.label}</button>`;

            </div>

          <!-- Quantity -->
          <section style="margin-bottom:var(--sp-6);">
            <h2 style="font:600 1.125rem var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-3);">Cantidad</h2>
            <div style="display:flex;flex-wrap:wrap;gap:var(--sp-2);">
              ${[10,20,30,0].map(q => {
                const sel = state.quantity === q;
                const label = q === 0 ? 'Todas' : String(q);
                return `<button onclick="App.ui._sesionSetQuantity(${q})"
                  style="border-radius:var(--radius-pill);padding:6px 20px;font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:36px;transition:background var(--dur-fast),border-color var(--dur-fast);${sel?'background:var(--blue-700);color:#fff;border:1.5px solid transparent;':'background:transparent;color:var(--text-secondary);border:1.5px solid var(--border);'}"
                  aria-pressed="${sel}">${label}</button>`;

            </div>

          <!-- Warning if insufficient words -->
          ${isInsufficient ? `
            <div style="padding:var(--sp-3) var(--sp-4);background:var(--amber-bg);border:1px solid var(--amber-light);border-radius:var(--radius-md);margin-bottom:var(--sp-4);font-size:var(--text-sm);color:var(--amber);">

    /* === 8. DICCIONARIO: SEARCH NORMALIZATION === */

    function normalizeSearch(str) {

        .replace(/[֑-ׇ]/g, '')   // strip Hebrew niqqud/cantillation

    /* === 9. DICCIONARIO SCREEN (SPEC §4.12) === */

    App.ui.renderDiccionario = function(el) {
      // Group words by category, preserving original order from vocab
      const catOrder = [];
      const catMap = {};
      for (const w of App.state.vocab) {
        if (!catMap[w.cat]) { catMap[w.cat] = []; catOrder.push(w.cat); }
        catMap[w.cat].push(w);
      }

      // Column definitions per word kind
      const kindCols = {
        verb:     { cols: ['es','msg'],            heads: ['Español','<span lang="he" dir="rtl">פועל</span>'] },
        expr:     { cols: ['es','msg'],            heads: ['Español','<span lang="he" dir="rtl">ביטוי</span>'] },
        country:  { cols: ['es','msg','group'],    heads: ['Español','<span lang="he" dir="rtl">מדינה</span>','<span lang="he" dir="rtl">אזור</span>'] },
        gendered: { cols: ['es','msg','fsg','mpl','fpl'], heads: ['Español','<span lang="he" dir="rtl">יחיד</span>','<span lang="he" dir="rtl">יחידה</span>','<span lang="he" dir="rtl">רבים</span>','<span lang="he" dir="rtl">רבות</span>'] },
        noun:     { cols: ['es','msg','mpl'],      heads: ['Español','<span lang="he" dir="rtl">יחיד</span>','<span lang="he" dir="rtl">רבים</span>'] }
      };
      const heFields = new Set(['msg','fsg','mpl','fpl','group']);

      function renderWordTable(words) {
        if (!words.length) return '';
        const { cols, heads } = kindCols[words[0].kind] || kindCols.noun;
        const thRow = heads.map((h, i) =>
          `<th style="padding:var(--sp-2) var(--sp-3);text-align:${i===0?'left':'right'};font:600 var(--text-xs) var(--font-body);color:var(--text-muted);border-bottom:2px solid var(--border);white-space:nowrap;">${h}</th>`
        ).join('');
        const tbRows = words.map(w => {
          const box = (App.state.progress[w.id] && App.state.progress[w.id].box) || 0;
          const cells = cols.map(col => {
            const val = w[col];
            if (col === 'es') {
              return `<td style="padding:var(--sp-2) var(--sp-3);font-size:var(--text-sm);color:var(--text-primary);border-bottom:1px solid var(--border);">${val||'—'} <span class="box-chip" data-box="${box}">${box}</span></td>`;
            }
            if (heFields.has(col) && val) {
              return `<td style="padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border);text-align:right;">` +
                `<span class="he" lang="he" dir="rtl" style="font-size:calc(var(--he-scale)*0.875rem);">${val}</span>` +
                ` <button onclick="App.ui.showToast('Audio disponible en fases futuras')" aria-label="Pronunciar" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:0.875rem;vertical-align:middle;">🔊</button></td>`;
            }
            return `<td style="padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border);color:var(--text-secondary);font-size:var(--text-sm);text-align:${heFields.has(col)?'right':'left'};">${val||'—'}</td>`;
          }).join('');
          return `<tr>${cells}</tr>`;
        }).join('');
        return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;"><table style="width:100%;border-collapse:collapse;font-size:var(--text-sm);"><thead><tr>${thRow}</tr></thead><tbody>${tbRows}</tbody></table></div>`;
      }

      function renderResults(query) {
        const norm = normalizeSearch(query);
        if (!norm) {
          // Default: all categories collapsed
          return catOrder.map(cat => {
            const words = catMap[cat];
            return `<details class="dict-cat" style="border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:var(--sp-3);overflow:hidden;">
              <summary style="padding:var(--sp-4);cursor:pointer;font:600 1rem var(--font-display);color:var(--text-primary);display:flex;justify-content:space-between;align-items:center;list-style:none;user-select:none;background:var(--surface);">
                <span>${cat}</span>
                <span style="font:400 var(--text-sm) var(--font-body);color:var(--text-muted);">${words.length} palabras</span>
              </summary>
              <div style="padding:0 var(--sp-1) var(--sp-2);">${renderWordTable(words)}</div>
            </details>`;
          }).join('');
        }
        // Search mode: flat list grouped by category heading
        const matched = [];
        for (const cat of catOrder) {
          const hits = catMap[cat].filter(w =>
            normalizeSearch(w.es).includes(norm)  ||
            normalizeSearch(w.msg).includes(norm) ||
            normalizeSearch(w.fsg).includes(norm) ||
            normalizeSearch(w.mpl).includes(norm) ||
            normalizeSearch(w.fpl).includes(norm)
          );
          if (hits.length) matched.push({ cat, hits });
        }
        if (!matched.length) {
          // T-04-01: escape query via textContent before inserting into DOM
          const safe = document.createElement('span');
          safe.textContent = query;
          return `<div style="padding:var(--sp-10) var(--sp-4);text-align:center;">
            <p style="color:var(--text-muted);margin-bottom:var(--sp-4);">Sin resultados para "<strong>${safe.innerHTML}</strong>"</p>
            <button onclick="document.getElementById('dict-search').value='';App.ui._dictUpdate('')"
              style="padding:var(--sp-2) var(--sp-5);border:1.5px solid var(--border);border-radius:var(--radius-pill);background:transparent;color:var(--text-secondary);font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:44px;">
              Limpiar búsqueda
            </button>
          </div>`;
        }
        return matched.map(({ cat, hits }) =>
          `<div style="margin-bottom:var(--sp-5);">
            <h3 style="font:600 1rem var(--font-display);color:var(--text-primary);padding:var(--sp-2) 0;border-bottom:1px solid var(--border);margin-bottom:var(--sp-2);">${cat}</h3>
            ${renderWordTable(hits)}
          </div>`
        ).join('');
      }

      el.innerHTML = `
        <div class="screen-diccionario">
          <header style="margin-bottom:var(--sp-5);">
            <h1 style="font:600 var(--text-4xl) var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-4);">Diccionario</h1>
            <div style="position:relative;">
              <input id="dict-search" type="search" placeholder="Buscar en español o hebreo…"
                oninput="App.ui._dictUpdate(this.value)"
                style="width:100%;padding:var(--sp-3) var(--sp-4) var(--sp-3) calc(var(--sp-4) + 20px);border:1.5px solid var(--border);border-radius:var(--radius-pill);background:var(--surface);color:var(--text-primary);font:400 var(--text-base) var(--font-body);outline:none;transition:border-color var(--dur-fast);min-height:44px;"
                onfocus="this.style.borderColor='var(--blue-700)'" onblur="this.style.borderColor='var(--border)'"
                aria-label="Buscar palabras">
              <svg style="position:absolute;left:var(--sp-4);top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
          </header>
          <div id="dict-results">${renderResults('')}</div>
          <div style="height:var(--sp-8);"></div>
        </div>`;

      App.ui._dictUpdate = function(query) {
        document.getElementById('dict-results').innerHTML = renderResults(query);
      };
    };


    /* === 10. INICIO SCREEN === */

    App.ui.renderInicio = function(el) {
      // Compute summary counts
      const prog   = App.state.progress;
      const total  = App.state.vocab.length;
      const progEntries = Object.values(prog);
      const mastered    = progEntries.filter(p => p.box === 5).length;
      const now         = Date.now();
      const dueToday    = progEntries.filter(p => p.box > 0 && p.due <= now).length;
      const inProgress  = progEntries.filter(p => p.box > 0).length;
      const newWords    = total - inProgress;
      const streak      = (App.state.stats && App.state.stats.streak) || 0;

      // Last sync date
      const cache = (function() {
        try { const v = localStorage.getItem('ivrit.v1.vocabCache'); return v ? JSON.parse(v) : null; } catch { return null; }
      })();
      const lastSync = cache && cache.updated
        ? new Date(cache.updated).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' })
        : 'Nunca';

      // Category progress bars — group vocab by category, count per box
      const catData = {};
      for (const w of App.state.vocab) {
        if (!catData[w.cat]) catData[w.cat] = { name: w.cat, counts: [0,0,0,0,0,0] };
        const box = (prog[w.id] && prog[w.id].box) || 0;
        catData[w.cat].counts[box]++;
      }
      const cats = Object.values(catData);

      // Mode grid: all 10 modes, all unavailable in Phase 1
      const modes = [
        { id: 'tarjetas',        icon: '🃏', name: 'Tarjetas',           desc: 'Memoriza con flashcards',           available: false },
        { id: 'opcion-multiple', icon: '❓', name: 'Opción múltiple',    desc: 'Elige la traducción correcta',      available: false },
        { id: 'unir',            icon: '↔',  name: 'Unir con flechas',   desc: 'Conecta pares español-hebreo',      available: false },
        { id: 'escribir',        icon: '✍',  name: 'Escribir',           desc: 'Escribe la traducción en hebreo',   available: false },
        { id: 'completar',       icon: '📝', name: 'Completar la forma', desc: 'Completa la forma correcta',        available: false },
        { id: 'concordancia',    icon: '🔤', name: 'Concordancia',       desc: 'Elige la forma según el pronombre', available: false },
        { id: 'clasificar',      icon: '📂', name: 'Clasificar',         desc: 'Arrastra palabras a sus grupos',    available: false },
        { id: 'contrarreloj',    icon: '⏱',  name: 'Contrarreloj',       desc: 'Responde en 60 segundos',           available: false },
        { id: 'repaso-errores',  icon: '🔁', name: 'Repaso de errores',  desc: 'Practica lo que fallaste',          available: false },
        { id: 'repaso-dia',      icon: '📅', name: 'Repaso del día',     desc: 'Palabras espaciadas de hoy',        available: false },
      ];

      // Box colors for stacked progress bars (box 0–5)
      const boxColors = ['var(--border)','#FFE4E4','var(--amber-light)','var(--blue-100)','var(--green-light)','var(--gold-light)'];

      el.innerHTML = `
        <div class="screen-inicio" style="padding-top: var(--sp-4);">

          <!-- Header -->
          <header style="margin-bottom: var(--sp-5);">
            <h1 style="font: 600 var(--text-4xl) var(--font-display); color: var(--text-primary); margin-bottom: var(--sp-1);">Ivrit</h1>
            <p style="font-size: var(--text-sm); color: var(--text-muted);">Vocabulario hebreo</p>
          </header>

          <!-- Summary stats: 3-col grid (wraps 5 cards) -->
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-5);">
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); text-align: center; box-shadow: var(--shadow-sm);">
              <div style="font: 700 var(--text-3xl) var(--font-display); color: var(--blue-700);">${total}</div>
              <div style="font: 600 var(--text-xs) var(--font-body); color: var(--text-muted); margin-top: var(--sp-1);">Total</div>
            </div>
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); text-align: center; box-shadow: var(--shadow-sm);">
              <div style="font: 700 var(--text-3xl) var(--font-display); color: var(--gold);">${mastered}</div>
              <div style="font: 600 var(--text-xs) var(--font-body); color: var(--text-muted); margin-top: var(--sp-1);">Dominadas</div>
            </div>
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); text-align: center; box-shadow: var(--shadow-sm);">
              <div style="font: 700 var(--text-3xl) var(--font-display); color: var(--amber);">${dueToday}</div>
              <div style="font: 600 var(--text-xs) var(--font-body); color: var(--text-muted); margin-top: var(--sp-1);">Para hoy</div>
            </div>
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); text-align: center; box-shadow: var(--shadow-sm);">
              <div style="font: 700 var(--text-3xl) var(--font-display); color: var(--blue-500);">${newWords}</div>
              <div style="font: 600 var(--text-xs) var(--font-body); color: var(--text-muted); margin-top: var(--sp-1);">Nuevas</div>
            </div>
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); text-align: center; box-shadow: var(--shadow-sm);">
              <div style="font: 700 var(--text-3xl) var(--font-display); color: var(--green);">${streak}</div>
              <div style="font: 600 var(--text-xs) var(--font-body); color: var(--text-muted); margin-top: var(--sp-1);">Racha 🔥</div>
            </div>
          </div>

          <!-- Repaso del día (prominent button) -->
          <button onclick="App.ui.showToast('Repaso del día disponible próximamente')"
            style="display: block; width: 100%; padding: var(--sp-4) var(--sp-6); background: var(--blue-700); color: var(--text-on-primary); border-radius: var(--radius-lg); font: 700 var(--text-lg) var(--font-body); box-shadow: var(--shadow-md); margin-bottom: var(--sp-6); cursor: pointer; border: none; transition: opacity var(--dur-fast);"
            onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'"
            aria-label="Iniciar repaso del día">
            📅 Repaso del día
          </button>

          <!-- Mode grid -->
          <section aria-labelledby="modos-heading" style="margin-bottom: var(--sp-8);">
            <h2 id="modos-heading" style="font: 600 1.375rem var(--font-display); color: var(--text-primary); margin-bottom: var(--sp-4);">Modos de estudio</h2>
            <div class="mode-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-3);">
              ${modes.map(m => `
                <div class="mode-card"
                  style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); box-shadow: var(--shadow-sm); ${!m.available ? 'opacity: 0.45; pointer-events: none;' : 'cursor: pointer;'}"
                  ${m.available ? `onclick="location.hash='#/${m.id}'" role="button" tabindex="0" aria-label="${m.name}"` : 'aria-hidden="true"'}>
                  <div style="font-size: 1.75rem; margin-bottom: var(--sp-2);" aria-hidden="true">${m.icon}</div>
                  <div style="font: 600 1rem var(--font-display); color: var(--text-primary); margin-bottom: var(--sp-1);">${m.name}</div>
                  <div style="font: 400 var(--text-xs) var(--font-body); color: var(--text-secondary);">${m.desc}</div>
                </div>`).join('')}
            </div>
          </section>

          <!-- Category progress bars -->
          <section aria-labelledby="cats-heading" style="margin-bottom: var(--sp-8);">
            <h2 id="cats-heading" style="font: 600 1.375rem var(--font-display); color: var(--text-primary); margin-bottom: var(--sp-4);">Progreso por categoría</h2>
            <div>
              ${cats.map(cat => {
                const catTotal = cat.counts.reduce((a, b) => a + b, 0);
                const bars = cat.counts.map((count, box) => {
                  const pct = catTotal > 0 ? (count / catTotal) * 100 : 0;
                  return pct > 0 ? `<div style="width:${pct.toFixed(1)}%; background:${boxColors[box]}; height:100%;" title="Caja ${box}: ${count}"></div>` : '';
                }).join('');
                return `
                  <div style="margin-bottom: var(--sp-3);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                      <span style="font: 600 var(--text-sm) var(--font-body); color: var(--text-primary);">${cat.name}</span>
                      <span style="font: 400 var(--text-xs) var(--font-body); color: var(--text-muted);">${catTotal}</span>
                    </div>
                    <div style="height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; display: flex;">${bars}</div>
                  </div>`;
              }).join('')}
            </div>
          </section>

          <!-- Sync section -->
          <section style="margin-bottom: var(--sp-8); padding: var(--sp-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--sp-3);">
              <span style="font: 400 var(--text-sm) var(--font-body); color: var(--text-muted);">Última sincronización: <strong style="color: var(--text-secondary);">${lastSync}</strong></span>
              <button onclick="App.ui.showToast('Sincronización disponible en la próxima versión')"
                style="padding: var(--sp-2) var(--sp-4); border: 1.5px solid var(--border); border-radius: var(--radius-pill); background: transparent; color: var(--text-secondary); font: 600 var(--text-sm) var(--font-body); cursor: pointer; min-height: 44px; transition: background var(--dur-fast);"
                onmouseover="this.style.background='var(--surface-hover)'" onmouseout="this.style.background='transparent'"
                aria-label="Sincronizar con Google Docs">
                🔄 Sincronizar
              </button>
            </div>
          </section>

        </div>`;

      // Responsive mode grid: 3 cols on desktop
      if (!document.getElementById('inicio-grid-style')) {
        const s = document.createElement('style');
        s.id = 'inicio-grid-style';
        s.textContent = '@media (min-width: 600px) { .mode-grid { grid-template-columns: repeat(3, 1fr) !important; } }';
        document.head.appendChild(s);
      }
    };


    /* === 11. ARRANQUE === */

    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
