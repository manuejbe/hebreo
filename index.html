<!DOCTYPE html>
<html lang="es" dir="ltr" data-theme="auto" data-he-size="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Estudia vocabulario hebreo con repetición espaciada">
  <title>Ivrit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Nunito:wght@400;600;700&family=Heebo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* === 1. CSS VARIABLES (DESIGN.md §1) === */

    :root {
      /* Fondos y superficies */
      --bg:              #F7F3EC;
      --surface:         #FFFFFF;
      --surface-raised:  #FFFEF9;
      --surface-hover:   #F0EBE0;

      /* Azul israelí — escala completa */
      --blue-900: #002D6B;
      --blue-800: #003F8F;
      --blue-700: #0052B4;
      --blue-600: #1467C8;
      --blue-500: #3382D8;
      --blue-200: #A8C8F0;
      --blue-100: #D6E8FF;
      --blue-50:  #EEF5FF;

      /* Texto */
      --text-primary:    #1A1814;
      --text-secondary:  #5A5347;
      --text-muted:      #9E9489;
      --text-on-primary: #FFFFFF;

      /* Acento: oro mediterráneo */
      --gold:       #C87A0A;
      --gold-light: #F5C842;

      /* Feedback */
      --green:        #1A7A42;
      --green-light:  #DCFCE7;
      --green-bg:     #F0FBF4;
      --red:          #C42B2B;
      --red-light:    #FFE4E4;
      --red-bg:       #FFF5F5;
      --amber:        #C25A00;
      --amber-light:  #FFECD4;
      --amber-bg:     #FFF8F0;

      /* Bordes y sombras */
      --border:       #E2D9CC;
      --border-focus: var(--blue-700);
      --shadow-sm:    0 1px 3px rgba(26,24,20,.08), 0 1px 2px rgba(26,24,20,.04);
      --shadow-md:    0 4px 12px rgba(26,24,20,.10), 0 2px 6px rgba(26,24,20,.06);
      --shadow-lg:    0 8px 24px rgba(26,24,20,.12), 0 4px 12px rgba(26,24,20,.08);
      --shadow-flip:  0 16px 40px rgba(26,24,20,.18);

      /* Tipografía */
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'Nunito', 'Helvetica Neue', sans-serif;
      --font-hebrew:  'Heebo', 'Arial Hebrew', sans-serif;

      /* Radio de borde */
      --radius-sm:   6px;
      --radius-md:   12px;
      --radius-lg:   18px;
      --radius-xl:   24px;
      --radius-pill: 999px;

      /* Espaciado (base 4px) */
      --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
      --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

      /* Animaciones */
      --dur-fast:  150ms;
      --dur-base:  250ms;
      --dur-slow:  400ms;
      --ease-out:  cubic-bezier(.22,.68,0,1.2);
      --ease-flip: cubic-bezier(.45,0,.55,1);

      /* Escala de texto */
      --text-xs:      0.75rem;
      --text-sm:      0.875rem;
      --text-base:    1rem;
      --text-lg:      1.125rem;
      --text-xl:      1.25rem;
      --text-2xl:     1.5rem;
      --text-3xl:     1.875rem;
      --text-4xl:     2.25rem;
      --text-display: 3rem;

      /* Escala hebreo */
      --he-scale: 1.25;
    }

    /* Tema oscuro: media query automático (no anula si data-theme="light") */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:             #0D1520;
        --surface:        #152030;
        --surface-raised: #1C2A3E;
        --surface-hover:  #1F3048;

        --text-primary:   #EDE6D8;
        --text-secondary: #A09880;
        --text-muted:     #6A614F;

        --border:      #2A3D55;
        --shadow-sm:   0 1px 3px rgba(0,0,0,.30);
        --shadow-md:   0 4px 12px rgba(0,0,0,.40);
        --shadow-lg:   0 8px 24px rgba(0,0,0,.50);
        --shadow-flip: 0 16px 40px rgba(0,0,0,.60);

        --green-bg:  #0A2A18;
        --red-bg:    #2A0A0A;
        --amber-bg:  #2A1800;
        --blue-50:   #0A1828;
        --blue-100:  #102040;
      }
    }

    /* Tema oscuro explícito (data-theme="dark") */
    [data-theme="dark"] {
      --bg:             #0D1520;
      --surface:        #152030;
      --surface-raised: #1C2A3E;
      --surface-hover:  #1F3048;

      --text-primary:   #EDE6D8;
      --text-secondary: #A09880;
      --text-muted:     #6A614F;

      --border:      #2A3D55;
      --shadow-sm:   0 1px 3px rgba(0,0,0,.30);
      --shadow-md:   0 4px 12px rgba(0,0,0,.40);
      --shadow-lg:   0 8px 24px rgba(0,0,0,.50);
      --shadow-flip: 0 16px 40px rgba(0,0,0,.60);

      --green-bg:  #0A2A18;
      --red-bg:    #2A0A0A;
      --amber-bg:  #2A1800;
      --blue-50:   #0A1828;
      --blue-100:  #102040;
    }

    /* Tema claro explícito — fuerza light incluso si OS es oscuro */
    [data-theme="light"] {
      --bg:             #F7F3EC;
      --surface:        #FFFFFF;
      --surface-raised: #FFFEF9;
      --surface-hover:  #F0EBE0;

      --text-primary:   #1A1814;
      --text-secondary: #5A5347;
      --text-muted:     #9E9489;

      --border:      #E2D9CC;
      --shadow-sm:   0 1px 3px rgba(26,24,20,.08), 0 1px 2px rgba(26,24,20,.04);
      --shadow-md:   0 4px 12px rgba(26,24,20,.10), 0 2px 6px rgba(26,24,20,.06);
      --shadow-lg:   0 8px 24px rgba(26,24,20,.12), 0 4px 12px rgba(26,24,20,.08);
      --shadow-flip: 0 16px 40px rgba(26,24,20,.18);

      --green-bg:  #F0FBF4;
      --red-bg:    #FFF5F5;
      --amber-bg:  #FFF8F0;
      --blue-50:   #EEF5FF;
      --blue-100:  #D6E8FF;
    }

    /* Tamaños de hebreo configurables */
    :root[data-he-size="normal"]    { --he-scale: 1.25; }
    :root[data-he-size="grande"]    { --he-scale: 1.50; }
    :root[data-he-size="muy-grande"]{ --he-scale: 1.75; }


    /* === 2. RESET & BASE === */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--text-primary);
      background: var(--bg);
      min-height: 100vh;
      min-width: 360px;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }
    img, svg { display: block; }


    /* === 3. TIPOGRAFÍA === */

    /* Clase base para hebreo (DESIGN.md §2.3) */
    .he {
      font-family: var(--font-hebrew);
      font-size: calc(var(--he-scale) * 1em);
      direction: rtl;
      unicode-bidi: isolate;
      text-align: right;
    }

    /* Estilos tipográficos semánticos */
    .text-display {
      font-family: var(--font-display);
      font-size: var(--text-display);
      font-weight: 600;
      line-height: 1.1;
    }
    .text-heading {
      font-family: var(--font-display);
      font-size: 1.375rem;
      font-weight: 600;
      line-height: 1.2;
    }
    .text-body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 400;
    }
    .text-label {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
    }
    .text-micro {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 400;
    }
    .text-nav {
      font-family: var(--font-body);
      font-size: 0.6875rem;
      font-weight: 600;
    }
    .text-muted { color: var(--text-muted); }
    .text-secondary { color: var(--text-secondary); }


    /* === 4. LAYOUT === */

    .app-main {
      max-width: 720px;
      margin: 0 auto;
      padding: var(--sp-4);
      padding-bottom: calc(56px + env(safe-area-inset-bottom) + var(--sp-4));
      min-height: 100vh;
    }
    @media (min-width: 600px) {
      .app-main { padding: var(--sp-6); padding-bottom: calc(56px + env(safe-area-inset-bottom) + var(--sp-6)); }
    }

    /* Pantallas: ocultas por defecto, activas cuando router las muestra */
    .screen { display: none; }
    .screen.active { display: block; }


    /* === 5. BARRA INFERIOR (DESIGN.md §3.4) === */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(56px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      z-index: 100;
    }
    [data-theme="dark"] .bottom-nav {
      background: rgba(21,32,48,.92);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .bottom-nav {
        background: rgba(21,32,48,.92);
      }
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 44px;
      min-height: 44px;
      color: var(--text-muted);
      font: 600 0.6875rem var(--font-body);
      position: relative;
      transition: color var(--dur-fast);
    }
    /* Dot indicator (DESIGN.md §3.4) */
    .nav-item::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 4px;
      border-radius: 2px;
      background: var(--blue-700);
      transition: width 200ms ease;
    }
    .nav-item.active { color: var(--blue-700); }
    .nav-item.active::after { width: 4px; }
    .nav-item:hover { color: var(--text-secondary); }
    .nav-item svg { flex-shrink: 0; }


    /* === 6. CHIPS DE CAJA LEITNER (DESIGN.md §3.8) === */

    .box-chip {
      border-radius: var(--radius-sm);
      padding: 2px 7px;
      font: 600 var(--text-xs) var(--font-body);
      display: inline-block;
    }
    .box-chip[data-box="0"] { background: var(--border);      color: var(--text-muted); }
    .box-chip[data-box="1"] { background: #FFE4E4;             color: var(--red); }
    .box-chip[data-box="2"] { background: var(--amber-light);  color: var(--amber); }
    .box-chip[data-box="3"] { background: var(--blue-100);     color: var(--blue-700); }
    .box-chip[data-box="4"] { background: var(--green-light);  color: var(--green); }
    .box-chip[data-box="5"] { background: var(--gold-light);   color: var(--gold); }


    /* === 7. TOAST (DESIGN.md §3.9) === */

    #toast-container {
      position: fixed;
      bottom: calc(64px + env(safe-area-inset-bottom) + var(--sp-3));
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      align-items: center;
      pointer-events: none;
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: var(--sp-3) var(--sp-5);
      max-width: 360px;
      white-space: nowrap;
      pointer-events: auto;
      animation: toast-in 250ms var(--ease-out) both;
    }
    .toast.out { animation: toast-out 200ms ease-in forwards; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } }
    @keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }


    /* === 8. TRANSICIONES DE PANTALLA (DESIGN.md §4) === */

    .page-leave { animation: page-out 200ms ease-in forwards; }
    .page-enter { animation: page-in 250ms var(--ease-out) 80ms both; }
    @keyframes page-out { to { opacity: 0; transform: translateY(-6px); } }
    @keyframes page-in  { from { opacity: 0; transform: translateY(10px); } }

    @media (prefers-reduced-motion: reduce) {
      .page-leave { animation: page-out-reduced 200ms ease-in forwards; }
      .page-enter { animation: page-in-reduced 250ms var(--ease-out) 80ms both; }
      @keyframes page-out-reduced { to { opacity: 0; } }
      @keyframes page-in-reduced  { from { opacity: 0; } }

      /* También reducir otras animaciones */
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }


    /* === 9. ANIMACIONES DE FEEDBACK (DESIGN.md §3.6) === */

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15%     { transform: translateX(-7px); }
      30%     { transform: translateX(6px); }
      45%     { transform: translateX(-5px); }
      60%     { transform: translateX(4px); }
      75%     { transform: translateX(-2px); }
      90%     { transform: translateX(2px); }
    }
    @keyframes flash-green {
      0%,100% { background: transparent; }
      40%     { background: rgba(26,122,66,.12); }
    }
    @keyframes flash-red {
      0%,100% { background: transparent; }
      40%     { background: rgba(196,43,43,.10); }
    }


    /* === 10. COMPONENTES DE TARJETAS (DESIGN.md §3.1) === */

    /* Flip 3D */
    .card-scene { perspective: 900px; }
    .card { transform-style: preserve-3d; transition: transform var(--dur-slow) var(--ease-flip); }
    .card.flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .card-back { transform: rotateY(180deg); }

    /* Barra de progreso de sesión (DESIGN.md §3.7) */
    .session-progress {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--border);
      z-index: 100;
    }
    .session-progress-fill {
      height: 100%;
      background: var(--blue-700);
      border-radius: 0 2px 2px 0;
      transition: width 300ms var(--ease-out);
    }


    /* === 11. UTILIDADES === */

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
    }
    :focus-visible {
      outline: 2px solid var(--blue-600);
      outline-offset: 2px;
      border-radius: inherit;
    }
    .text-center { text-align: center; }
    .mt-4 { margin-top: var(--sp-4); }
    .mt-6 { margin-top: var(--sp-6); }
  </style>
</head>

  <!-- CONTENEDOR DE TOASTS -->
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

  <script>
    'use strict';

    /* === CONFIG === */
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmqmnYsJrX-ux2YE1TFzfwag76I1VDibe5hewXXa8O8sODnY6qjCdcYlg5dLgE7K2s/exec";

    /* === 1. APP OBJECT SCAFFOLD === */

    const App = {
      data:   {},  // normalize, load functions (Plan 02)
      state:  {
        vocab:      [],        // normalized word list (loaded Plan 02)
        progress:   {},        // Leitner progress by wordId (expanded Plan 05)
        settings:   { theme: 'auto', heSize: 'normal' },
        stats:      {},        // session stats (Plan 05)
        storageOk:  true       // false si localStorage no está disponible
      },
      session: {},  // populated by session.start(); read by renderTarjetas / renderOpcionMultiple
      router: {},  // navigate, current route (Plan 03)
      ui:     {}   // render functions, toast
    };

    App.init = async function() {
      App.ui.initTheme();
      await App.data.load();
      App.router.init();
    };


    /* === 2. HELPERS DE ALMACENAMIENTO === */

    const Store = {
      get(key) {
        try {
          const v = localStorage.getItem(key);
          return v ? JSON.parse(v) : null;
        } catch {
          App.state.storageOk = false;
          return null;
        }
      },
      set(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch {
          App.state.storageOk = false;
        }
      },
      remove(key) {
        try {
          localStorage.removeItem(key);
        } catch {
          App.state.storageOk = false;
        }
      }
    };


    /* === 3. SISTEMA DE TEMA === */

    /**
     * Aplica el tema visual.
     * @param {'auto'|'claro'|'oscuro'} theme
     */
    App.ui.applyTheme = function(theme) {
      const html = document.documentElement;
      if (theme === 'oscuro') {
        html.setAttribute('data-theme', 'dark');
      } else if (theme === 'claro') {
        html.setAttribute('data-theme', 'light');
      } else {
        // auto: eliminar atributo para que la media query decida
        html.removeAttribute('data-theme');
      }
      App.state.settings.theme = theme;
      Store.set('ivrit.v1.settings', App.state.settings);
    };

    App.ui.initTheme = function() {
      const saved = Store.get('ivrit.v1.settings') || {};
      const theme = saved.theme || 'auto';
      const heSize = saved.heSize || 'normal';
      // Restaurar heSize también
      document.documentElement.setAttribute('data-he-size', heSize);
      App.state.settings.heSize = heSize;
      // Aplicar tema (también persiste en settings)
      App.ui.applyTheme(theme);
    };


    /* === 4. UTILIDADES DE UI === */

    /**
     * Muestra un toast en la parte inferior.
     * @param {string} msg
     * @param {number} duration ms antes de cerrar (default 3000)
     */
    App.ui.showToast = function(msg, duration = 3000) {

    /** Runs sync, manages button state, shows result panel or error toast. */

    /* === 5. DATOS: NORMALIZACIÓN Y CARGA === */

    /**
     * Mapeo encabezado hebreo → campo normalizado (SPEC §2.2).
     * Por texto, no por posición.
     */
    const HEADER_MAP = {
      'תרגום': 'es',
      'יחיד':  'msg',
      'רבים':  'mpl',
      'יחידה': 'fsg',
      'רבות':  'fpl',
      'פועל':  'msg',   // verbo infinitivo → msg
      'ביטוי': 'msg',   // expresión → msg
      'מדינה': 'msg',   // nombre de país → msg
      'אזור':  'group', // región (país)
      'תחום':  'group', // área (profesión)
    };

    /** Convierte una categoría en su kind según los encabezados (SPEC §2.3). */
    function detectKind(headerSet) {
      if (headerSet.has('פועל'))  return 'verb';
      if (headerSet.has('ביטוי')) return 'expr';
      if (headerSet.has('מדינה')) return 'country';
      if (headerSet.has('יחידה') || headerSet.has('רבות')) return 'gendered';
      return 'noun';
    }

    /** Convierte string a slug URL-safe (sin acentos, lowercase, guiones). */
    function slugify(str) {
      return String(str).normalize('NFD').replace(/[̀-ͯ]/g, '')
        .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    /**
     * Normaliza el JSON crudo de vocab.json → array de word objects (SPEC §2.2–2.4).
     * Función pura: no toca App.state.
     * @param {object} rawData — objeto con .categories[]
     * @returns {Array} words[]
     */
    App.data.normalize = function(rawData) {
      // Fusionar categorías con el mismo nombre (SPEC §2.1)
      const merged = [];
      const catIdx = {};
      for (const cat of rawData.categories) {
        if (catIdx[cat.name] !== undefined) {
          merged[catIdx[cat.name]].rows.push(...cat.rows);
        } else {
          catIdx[cat.name] = merged.length;
          merged.push({ name: cat.name, headers: cat.headers, rows: [...cat.rows] });
        }
      }

      const words = [];
      for (const cat of merged) {
        const catSlug  = slugify(cat.name);
        const headerSet = new Set(cat.headers);
        const kind      = detectKind(headerSet);
        const seenBase  = {};  // baseId → true, para detectar duplicados

        for (const row of cat.rows) {
          const word = {
            id: '', cat: cat.name, kind,
            es: '', msg: null, mpl: null, fsg: null, fpl: null, group: null, extra: {}
          };

          for (let i = 0; i < cat.headers.length; i++) {
            const header = cat.headers[i];
            const raw    = row[i];
            // "—" o vacío → null (SPEC §2.4)
            const val = (raw === '—' || raw === undefined || raw === null || String(raw).trim() === '')
              ? null : String(raw).trim();
            const field = HEADER_MAP[header];
            if (field) {
              word[field] = val;
            } else {
              word.extra[header] = val;
            }
          }

          // ID estable: slug(cat)::slug(es) [+ ::slug(msg) si hay duplicado] (SPEC §2.4)
          const baseId = catSlug + '::' + slugify(word.es || '');
          if (seenBase[baseId]) {
            word.id = baseId + '::' + slugify(word.msg || '');
          } else {
            word.id    = baseId;
            seenBase[baseId] = true;
          }

          words.push(word);
        }
      }
      return words;
    };

    /**
     * Carga vocab.json (o caché de localStorage si es más nueva),
     * normaliza y puebla App.state.vocab. (SPEC §3)
     */
    App.data.load = async function() {
      let raw = null;

      try {
        const resp = await fetch('./vocab.json');
        if (resp.ok) raw = await resp.json();
      } catch (_) { /* sin red / file:// — caerá a caché */ }

      const cache = Store.get('ivrit.v1.vocabCache');

      if (raw && cache && cache.updated && raw.updated && cache.updated >= raw.updated) {
        // Caché más nueva o igual → usar caché
        raw = cache.raw;
      } else if (raw) {
        // Archivo más nuevo → actualizar caché
        Store.set('ivrit.v1.vocabCache', { raw, updated: raw.updated || new Date().toISOString() });
      } else if (cache && cache.raw) {
        // Fetch falló, usar caché
        App.ui.showToast('Usando vocabulario guardado en caché');
        raw = cache.raw;
      } else {
        // Todo falló
        App.ui.showToast('No se pudo cargar el vocabulario');
        App.state.vocab = [];
        return;
      }

      try {
        App.state.vocab = App.data.normalize(raw);
      } catch (_) {
        App.ui.showToast('Error al procesar el vocabulario');
        App.state.vocab = [];
        return;
      }

      // Restaurar progreso y settings persistidos
      App.state.progress = Store.get('ivrit.v1.progress') || {};
      App.state.stats    = Store.get('ivrit.v1.stats')    || {};
      const saved = Store.get('ivrit.v1.settings') || {};
      Object.assign(App.state.settings, saved);
    };


    /* === 5b. SINCRONIZACIÓN === */

    App.sync = {};

    App.sync.fetchWithTimeout = async function(url, ms) {
      if (!navigator.onLine) throw Object.assign(new Error('sin conexión'), { code: 'offline' });
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      try {
        const resp = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!resp.ok) throw Object.assign(new Error('URL no responde'), { code: 'timeout' });
        return await resp.json();
      } catch (err) {
        clearTimeout(timer);
        if (err.code) throw err;
        if (err.name === 'AbortError') throw Object.assign(new Error('La URL no respondió en 20 s'), { code: 'timeout' });
        throw Object.assign(new Error('sin conexión'), { code: 'offline' });
      }
    };

    App.sync.validateRaw = function(data) {
      return !!(data &&
        data.source === 'google-docs' &&
        Array.isArray(data.categories) &&
        data.categories.length > 0 &&
        data.categories.every(c =>
          typeof c.name === 'string' &&
          Array.isArray(c.headers) &&
          Array.isArray(c.rows)
        )
      );
    };

    App.sync.diffVocab = function(oldWords, newWords) {
      const oldMap = new Map(oldWords.map(w => [w.id, w]));
      const newMap = new Map(newWords.map(w => [w.id, w]));
      const FIELDS = ['es', 'msg', 'mpl', 'fsg', 'fpl', 'group'];

      const added    = newWords.filter(w => !oldMap.has(w.id));
      const deleted  = oldWords.filter(w => !newMap.has(w.id));
      const modified = newWords.filter(w => {
        const old = oldMap.get(w.id);
        if (!old) return false;
        return FIELDS.some(f => w[f] !== old[f]);
      });

      return { added, modified, deleted };
    };

    App.sync.applyDiff = function(diff, rawData) {
      // Added: push to vocab (no progress entry = box 0 by default)
      diff.added.forEach(w => App.state.vocab.push(w));

      // Modified: replace in-place, preserve progress
      diff.modified.forEach(w => {
        const idx = App.state.vocab.findIndex(v => v.id === w.id);
        if (idx !== -1) App.state.vocab[idx] = w;
      });

      // Deleted: remove from vocab, keep progress (SYNC-04)
      diff.deleted.forEach(w => {
        const idx = App.state.vocab.findIndex(v => v.id === w.id);
        if (idx !== -1) App.state.vocab.splice(idx, 1);
      });

      // Persist updated cache
      Store.set('ivrit.v1.vocabCache', {
        raw: rawData,
        updated: rawData.updated || new Date().toISOString()
      });
    };

    App.sync.run = async function() {
      let raw;
      try {
        raw = await App.sync.fetchWithTimeout(APPS_SCRIPT_URL, 20000);
      } catch (err) {
        throw { code: err.code || 'offline', message: err.message };
      }
      if (!App.sync.validateRaw(raw)) {
        throw { code: 'invalid', message: 'El formato de la respuesta no es válido' };
      }
      let newWords;
      try {
        newWords = App.data.normalize(raw);
      } catch (_) {
        throw { code: 'invalid', message: 'Error al procesar los datos recibidos' };
      }
      const diff = App.sync.diffVocab(App.state.vocab, newWords);
      App.sync.applyDiff(diff, raw);
      return { diff, updatedAt: raw.updated || new Date().toISOString() };
    };


    /* === 6b. SESSION ENGINE === */

    App.session.start = function(mode) {
      const st = App.ui._sesionState;   // { cats, filter, direction, quantity }
      const catOrder = [];
      const catSeen = new Set();
      for (const w of App.state.vocab) { if (!catSeen.has(w.cat)) { catOrder.push(w.cat); catSeen.add(w.cat); } }
      const selected = st.cats.length === 0 ? catOrder : st.cats;
      const now = Date.now();
      const sevenDaysAgo = now - 7 * 24 * 60 * 60 * 1000;
      let words = App.state.vocab.filter(w => selected.includes(w.cat));
      if (st.filter === 'nuevas') {
        words = words.filter(w => !App.state.progress[w.id] || App.state.progress[w.id].box === 0);
      } else if (st.filter === 'dificiles') {
        words = words.filter(w => { const p = App.state.progress[w.id]; if (!p) return true; return p.box <= 2 || (p.lastWrong && p.lastWrong >= sevenDaysAgo); });
      } else if (st.filter === 'hoy') {
        words = words.filter(w => { const p = App.state.progress[w.id]; return p && p.box > 0 && p.due <= now; });
      }
      // Shuffle (Fisher-Yates)
      for (let i = words.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [words[i], words[j]] = [words[j], words[i]];
      }
      const qty = st.quantity === 0 ? words.length : st.quantity;
      const startFn = App.session.start;  // preserve reference before replacing object
      App.session = {
        mode,
        words: words.slice(0, qty),
        index: 0,
        direction: st.direction,
        results: []    // { wordId, correct: bool }
      };
      App.session.start = startFn;  // re-attach so subsequent calls still work
    };

    App.ui.updateProgress = function(wordId, correct) {
      const p = App.state.progress[wordId] || { box: 0, due: 0, seen: 0, correct: 0, wrong: 0, lastWrong: null, streak: 0 };
      p.seen++;
      if (correct) {
        p.correct++;
        p.streak = (p.streak || 0) + 1;
        p.box = Math.min(p.box + 1, 5);          // per LEIT-02: sube una caja
      } else {
        p.wrong++;
        p.streak = 0;
        p.lastWrong = Date.now();
        p.box = 1;                                 // per LEIT-02: vuelve a caja 1
      }
      // due timestamp placeholder (full intervals come in Phase 5)
      p.due = Date.now();
      App.state.progress[wordId] = p;
      Store.set('ivrit.v1.progress', App.state.progress);  // persist after every answer
    };

    /**
     * Renders session result screen. Called by renderTarjetas and renderOpcionMultiple.
     * @param {HTMLElement} el — screen container
     */
    App.ui.renderResultado = function(el) {
      const { results, words, mode } = App.session;
      const total   = results.length;
      const correct = results.filter(r => r.correct).length;
      const wrong   = results.filter(r => !r.correct);

      el.innerHTML = '';

      // Header
      const header = document.createElement('header');
      header.style.cssText = 'padding:var(--sp-8) var(--sp-4) var(--sp-6);text-align:center;';
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      const title = document.createElement('h1');
      title.style.cssText = 'font:600 3rem var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-2);';
      title.textContent = pct >= 80 ? '¡Muy bien!' : pct >= 50 ? 'Buen progreso' : 'Sigue practicando';
      header.appendChild(title);

      const sub = document.createElement('p');
      sub.style.cssText = 'font:400 var(--text-base) var(--font-body);color:var(--text-muted);';
      sub.textContent = correct + ' de ' + total + ' correctas (' + pct + '%)';
      header.appendChild(sub);
      el.appendChild(header);

      // Wrong words list
      if (wrong.length > 0) {
        const section = document.createElement('section');
        section.style.cssText = 'padding:0 var(--sp-4);margin-bottom:var(--sp-6);';
        const h2 = document.createElement('h2');
        h2.style.cssText = 'font:600 1.125rem var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-3);';
        h2.textContent = 'Palabras a repasar (' + wrong.length + ')';
        section.appendChild(h2);

        const list = document.createElement('ul');
        list.style.cssText = 'list-style:none;display:flex;flex-direction:column;gap:var(--sp-2);';
        for (const r of wrong) {
          const w = App.state.vocab.find(v => v.id === r.wordId);
          if (!w) continue;
          const li = document.createElement('li');
          li.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:var(--sp-3) var(--sp-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);gap:var(--sp-3);';
          const esSpan = document.createElement('span');
          esSpan.style.cssText = 'font:600 var(--text-sm) var(--font-body);color:var(--text-primary);';
          esSpan.textContent = w.es;    // textContent — XSS safe
          const heSpan = document.createElement('span');
          heSpan.lang = 'he'; heSpan.dir = 'rtl';
          heSpan.style.cssText = 'font-family:var(--font-hebrew);font-size:calc(var(--he-scale)*0.95rem);color:var(--text-secondary);';
          heSpan.textContent = w.msg || '';  // textContent — XSS safe
          li.appendChild(esSpan);
          li.appendChild(heSpan);
          list.appendChild(li);
        }
        section.appendChild(list);
        el.appendChild(section);
      }

      // Action buttons
      const btnArea = document.createElement('div');
      btnArea.style.cssText = 'padding:0 var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);';

      // "Repetir las que no sabia" — only if there are wrong words
      if (wrong.length > 0) {
        const retryBtn = document.createElement('button');
        retryBtn.style.cssText = 'display:block;width:100%;padding:var(--sp-4);background:var(--blue-700);color:#fff;border-radius:var(--radius-lg);font:700 var(--text-lg) var(--font-body);border:none;cursor:pointer;transition:background var(--dur-fast);';
        retryBtn.textContent = 'Repetir las que no sabia (' + wrong.length + ')';
        retryBtn.setAttribute('aria-label', 'Repetir ' + wrong.length + ' palabras incorrectas');
        retryBtn.addEventListener('mouseenter', () => { retryBtn.style.background = 'var(--blue-800)'; });
        retryBtn.addEventListener('mouseleave', () => { retryBtn.style.background = 'var(--blue-700)'; });
        retryBtn.addEventListener('click', () => {
          // Start a new session with only the wrong words
          App.session.words  = wrong.map(r => App.state.vocab.find(v => v.id === r.wordId)).filter(Boolean);
          App.session.index  = 0;
          App.session.results = [];
          // Navigate to the same mode
          location.hash = '#/' + (App.session.mode || 'tarjetas');
        });
        btnArea.appendChild(retryBtn);
      }

      const newBtn = document.createElement('button');
      newBtn.style.cssText = 'display:block;width:100%;padding:var(--sp-3) var(--sp-4);border:1.5px solid var(--border);border-radius:var(--radius-lg);font:600 var(--text-base) var(--font-body);background:transparent;color:var(--text-secondary);cursor:pointer;transition:background var(--dur-fast);';
      newBtn.textContent = 'Nueva sesion';
      newBtn.addEventListener('mouseenter', () => { newBtn.style.background = 'var(--surface-hover)'; });
      newBtn.addEventListener('mouseleave', () => { newBtn.style.background = 'transparent'; });
      newBtn.addEventListener('click', () => { location.hash = '#/sesion'; });
      btnArea.appendChild(newBtn);

      el.appendChild(btnArea);
    };


    /* === 7. TARJETAS SCREEN (SPEC §4.3, FLAS-01..06) === */

    App.ui.renderTarjetas = function(el) {
      if (!App.session || !App.session.words || App.session.words.length === 0) {
        location.hash = '#/sesion'; return;
      }
      // Session end check
      if (App.session.index >= App.session.words.length) {
        App.ui.renderResultado(el); return;
      }

      const total = App.session.words.length;
      const idx   = App.session.index;
      const word  = App.session.words[idx];
      const pct   = (idx / total) * 100;

      // Determine front/back direction
      const dir = App.session.direction === 'mezclada'
        ? (Math.random() < 0.5 ? 'es-he' : 'he-es')
        : App.session.direction;
      App.session._cardDir = dir;

      const frontText  = dir === 'es-he' ? word.es : (word.msg || word.es);
      const frontIsHe  = dir === 'he-es';

      // Build back content per kind (SPEC §4.3)
      function addRow(table, labelHe, valHe, isHe) {
        const tr = document.createElement('tr');
        const tdLabel = document.createElement('td');
        tdLabel.style.cssText = 'padding:4px 0;color:rgba(255,255,255,.60);font-size:var(--text-xs);width:60px;';
        if (isHe) { tdLabel.lang = 'he'; tdLabel.dir = 'rtl'; tdLabel.style.fontFamily = 'var(--font-hebrew)'; }
        tdLabel.textContent = labelHe;
        const tdVal = document.createElement('td');
        tdVal.style.cssText = 'padding:4px 0;text-align:right;';
        if (isHe) {

      function flipCard() {

        if (qualified) return;  // T-03-06: guard

      card.addEventListener('click', (e) => {
        if (Math.abs(e.clientX - swipeStartX) < 5) flipCard();

      card.addEventListener('keydown', e => {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }

      // Touch swipe (FLAS-04)
      card.addEventListener('touchstart', e => {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;

      card.addEventListener('touchmove', e => {
        if (!isFlipped) return;
        const dx = e.touches[0].clientX - swipeStartX;
        const dy = e.touches[0].clientY - swipeStartY;
        if (Math.abs(dx) < Math.abs(dy)) return;  // vertical scroll — ignore
        const t = Math.min(Math.abs(dx) / 120, 1);
        if (dx > 0) {
          overlay.style.background = 'rgba(26,122,66,.18)';
          overlay.style.color = 'var(--green)';

      card.addEventListener('touchend', e => {

      // Keyboard (FLAS-05: Space=flip, ArrowRight=sabe, ArrowLeft=no sabe)
      function onKey(e) {
        if (e.key === 'ArrowRight' && isFlipped) { e.preventDefault(); qualify(true);  }

    App.router = {
      current: { route: 'inicio', params: {} },

      _parseHash(hash) {
        // '#/inicio?cat=Verbos' → { route: 'inicio', params: { cat: 'Verbos' } }
        const withoutHash = (hash || '#/inicio').replace(/^#\/?/, '');
        const [routePart, queryPart] = withoutHash.split('?');
        const route = routePart || 'inicio';
        const params = {};
        if (queryPart) {
          queryPart.split('&').forEach(pair => {
            const [k, v] = pair.split('=');
            if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
          });
        }
        return { route, params };
      },

      navigate(hash) {
        const parsed = App.router._parseHash(hash);
        App.router.current = parsed;

        // Update nav active state
        document.querySelectorAll('.nav-item').forEach(el => {
          const r = el.dataset.route;
          const studyRoutes = ['sesion','tarjetas','opcion-multiple','unir','completar','concordancia','escribir','clasificar','contrarreloj'];
          let active = false;
          if (r === 'sesion')        active = studyRoutes.includes(parsed.route);
          else if (r === 'estadisticas')  active = parsed.route === 'estadisticas';
          else if (r === 'configuracion') active = parsed.route === 'configuracion';
          else if (r === 'diccionario')   active = parsed.route === 'diccionario';
          else if (r === 'inicio')        active = parsed.route === 'inicio';
          el.classList.toggle('active', active);
        });

        // Page transition: add leave class to current content
        const main = document.getElementById('app-main');
        const existing = main.firstElementChild;
        if (existing) {
          existing.classList.add('page-leave');
          existing.addEventListener('animationend', () => {
            App.router._renderScreen(parsed, main);
          }, { once: true });
          // Fallback for reduced-motion (animation may not fire)
          setTimeout(() => {
            if (main.firstElementChild === existing) {
              App.router._renderScreen(parsed, main);
            }
          }, 250);
        } else {
          App.router._renderScreen(parsed, main);
        }
      },

      _renderScreen(parsed, main) {
        main.innerHTML = '';
        const screenEl = document.createElement('div');
        screenEl.className = 'screen active page-enter';

        const renderers = {
          inicio:           () => App.ui.renderInicio(screenEl),
          diccionario:      () => App.ui.renderDiccionario(screenEl),
          sesion:           () => App.ui.renderSesion(screenEl),
          tarjetas:         () => App.ui.renderTarjetas(screenEl),
          'opcion-multiple':() => App.ui.renderOpcionMultiple(screenEl),
          resultado:        () => App.ui.renderResultado(screenEl),
        };

        const stubs = ['unir','completar','concordancia',
                       'escribir','clasificar','contrarreloj','estadisticas','configuracion'];
        if (renderers[parsed.route]) {
          renderers[parsed.route]();
        } else if (stubs.includes(parsed.route)) {
          App.ui.renderStub(screenEl, parsed.route);
        } else {
          App.ui.renderInicio(screenEl); // fallback
        }

        main.appendChild(screenEl);
      },

      init() {
        window.addEventListener('hashchange', () => {
          App.router.navigate(window.location.hash);
        });
        const hash = window.location.hash || '#/inicio';
        if (!window.location.hash) history.replaceState(null, '', '#/inicio');
        App.router.navigate(hash);
      }
    };

    /* === 8. OPCION MULTIPLE SCREEN (SPEC §4.4, MCQ-01..04) === */

    /**
     * Returns 3 distractor words for the MCQ question.
     * Priority: same kind + same cat. For countries: same group (region) first.
     * Fallback: same kind any cat → any word. Never duplicates correct word's visible text.
     * MCQ-01, MCQ-02
     * @param {Object} correct - the correct word
     * @param {'es-he'|'he-es'} dir - resolved direction
     * @returns {Object[]} array of 3 distractor word objects
     */
    function getDistractors(correct, dir) {
      function getText(w) { return dir === 'es-he' ? w.msg : w.es; }
      const usedTexts = new Set([getText(correct)]);

      function isValid(w) {
        if (w.id === correct.id) return false;
        const t = getText(w);
        if (!t || usedTexts.has(t)) return false;
        return true;
      }

      function pickN(pool, n) {
        const result = [];
        const arr = pool.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        for (const w of arr) {
          if (result.length >= n) break;
          if (!isValid(w)) continue;
          usedTexts.add(getText(w));
          result.push(w);
        }
        return result;
      }

      const vocab = App.state.vocab;
      let distractors = [];

      if (correct.kind === 'country' && correct.group) {
        // Same region first (MCQ-02)
        distractors = pickN(vocab.filter(w => w.kind === 'country' && w.group === correct.group), 3);
      }

      if (distractors.length < 3) {
        // Same kind + same cat
        distractors = distractors.concat(pickN(vocab.filter(w => w.kind === correct.kind && w.cat === correct.cat), 3 - distractors.length));
      }

      if (distractors.length < 3) {
        // Same kind, any cat
        distractors = distractors.concat(pickN(vocab.filter(w => w.kind === correct.kind), 3 - distractors.length));
      }

      if (distractors.length < 3) {
        // Final fallback: any word
        distractors = distractors.concat(pickN(vocab, 3 - distractors.length));
      }

      return distractors.slice(0, 3);
    }

    App.ui.renderOpcionMultiple = function(el) {
      if (!App.session || !App.session.words || App.session.words.length === 0) {
        location.hash = '#/sesion'; return;
      }
      if (App.session.index >= App.session.words.length) {
        App.ui.renderResultado(el); return;
      }

      const total = App.session.words.length;
      const idx   = App.session.index;
      const word  = App.session.words[idx];
      const pct   = (idx / total) * 100;

      // Resolve direction
      const dir = App.session.direction === 'mezclada'
        ? (Math.random() < 0.5 ? 'es-he' : 'he-es')
        : App.session.direction;
      App.session._cardDir = dir;

      function getOptionText(w) { return dir === 'es-he' ? (w.msg || '?') : w.es; }
      const questionText = dir === 'es-he' ? word.es : (word.msg || word.es);
      const questionIsHe = dir === 'he-es';

      // 1 correct + 3 distractors, shuffled
      const distractors = getDistractors(word, dir);
      const options = [{ word, correct: true }, ...distractors.map(w => ({ word: w, correct: false }))];
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];

      const optionEls = [];

        btn.setAttribute('aria-label', 'Opcion ' + (i + 1) + ': ' + getOptionText(opt.word));

        chip.style.cssText = 'position:absolute;top:var(--sp-2);left:var(--sp-2);width:18px;height:18px;background:var(--blue-100);color:var(--blue-700);border-radius:3px;font:600 var(--text-xs) var(--font-body);display:flex;align-items:center;justify-content:center;font-size:0.65rem;';

        } else {
