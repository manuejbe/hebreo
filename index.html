        btn.addEventListener('mouseleave', () => { if (!answered) { btn.style.borderColor = 'var(--border)'; btn.style.background = 'var(--surface)'; } });
        btn.addEventListener('click', () => handleAnswer(i, opt.correct));
        optionEls.push(btn);
        grid.appendChild(btn);
      });

      el.appendChild(grid);

      // "Siguiente" button — hidden until answered
      const nextBtn = document.createElement('button');
      nextBtn.style.cssText = 'display:none;width:calc(100% - var(--sp-8));margin:0 var(--sp-4);padding:var(--sp-3) var(--sp-4);background:var(--blue-700);color:#fff;border-radius:var(--radius-md);font:700 var(--text-base) var(--font-body);border:none;cursor:pointer;transition:background var(--dur-fast);';
      nextBtn.textContent = 'Siguiente';
      nextBtn.setAttribute('aria-label', 'Siguiente pregunta');
      nextBtn.addEventListener('mouseenter', () => { nextBtn.style.background = 'var(--blue-800)'; });
      nextBtn.addEventListener('mouseleave', () => { nextBtn.style.background = 'var(--blue-700)'; });
      nextBtn.addEventListener('click', advance);
      el.appendChild(nextBtn);

      function handleAnswer(chosenIdx, isCorrect) {
        if (answered) return;  // T-03-08: double-answer guard
        answered = true;

        App.ui.updateProgress(word.id, isCorrect);
        App.session.results.push({ wordId: word.id, correct: isCorrect });

        // Apply visual feedback (DESIGN.md §3.2, MCQ-03)
        options.forEach((opt, i) => {
          const btn = optionEls[i];
          btn.style.cursor = 'default';
          if (opt.correct) {
            btn.style.background  = 'var(--green-bg)';
            btn.style.borderColor = 'var(--green)';
            btn.style.color       = 'var(--green)';
          } else if (i === chosenIdx && !isCorrect) {
            btn.style.background  = 'var(--red-bg)';
            btn.style.borderColor = 'var(--red)';
            btn.style.color       = 'var(--red)';
          } else {
            btn.style.opacity       = '.45';
            btn.style.pointerEvents = 'none';
          }
        });

        // Flash/shake on question (DESIGN.md §3.6)
        qSection.style.animation = isCorrect ? 'flash-green 350ms ease-out' : 'shake 300ms ease-out';
        qSection.addEventListener('animationend', () => { qSection.style.animation = ''; }, { once: true });

        // Show all forms of correct word (MCQ-03)
        const formsPanel = document.createElement('div');
        formsPanel.style.cssText = 'padding:var(--sp-3) var(--sp-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);margin:var(--sp-3) var(--sp-4) 0;';
        const formsTitle = document.createElement('p');
        formsTitle.style.cssText = 'font:600 var(--text-xs) var(--font-body);color:var(--text-muted);margin-bottom:var(--sp-2);text-transform:uppercase;letter-spacing:.04em;';
        formsTitle.textContent = word.es;
        formsPanel.appendChild(formsTitle);
        const formsTable = document.createElement('table');
        formsTable.style.cssText = 'width:100%;border-collapse:collapse;font-size:calc(var(--he-scale)*0.875rem);';
        function addFormRow(label, val) {
          if (!val) return;
          const tr = document.createElement('tr');
          const tdL = document.createElement('td');
          tdL.style.cssText = 'padding:2px 0;color:var(--text-muted);font-size:var(--text-xs);width:60px;';
          tdL.lang = 'he'; tdL.dir = 'rtl'; tdL.style.fontFamily = 'var(--font-hebrew)';
          tdL.textContent = label;
          const tdV = document.createElement('td');
          tdV.style.cssText = 'padding:2px 0;text-align:right;';
          tdV.lang = 'he'; tdV.dir = 'rtl'; tdV.style.fontFamily = 'var(--font-hebrew)';
          tdV.textContent = val;
          tr.appendChild(tdL); tr.appendChild(tdV); formsTable.appendChild(tr);
        }
        if      (word.kind === 'noun')     { addFormRow('יחיד', word.msg); if (word.mpl && word.mpl !== word.msg) addFormRow('רבים', word.mpl); }
        else if (word.kind === 'gendered') { addFormRow('יחיד', word.msg); addFormRow('יחידה', word.fsg); if (word.mpl !== word.msg) addFormRow('רבים', word.mpl); addFormRow('רבות', word.fpl); }
        else if (word.kind === 'verb')     { addFormRow('פועל', word.msg); }
        else if (word.kind === 'country')  { addFormRow('מדינה', word.msg); if (word.group) addFormRow('אזור', word.group); }
        else                               { addFormRow('ביטוי', word.msg); }
        formsPanel.appendChild(formsTable);
        el.insertBefore(formsPanel, nextBtn);

        nextBtn.style.display = 'block';
      }

      function advance() {
        App.session.index++;
        App.ui.renderOpcionMultiple(el);
      }

      // Keyboard shortcuts (MCQ-04: 1-4 choose, Enter advance)
      function onKey(e) {
        if (e.key >= '1' && e.key <= '4') {
          const i = parseInt(e.key, 10) - 1;
          if (i < options.length) { e.preventDefault(); if (!answered) handleAnswer(i, options[i].correct); }
        }
        if (e.key === 'Enter') { e.preventDefault(); if (answered) advance(); }
      }
      document.addEventListener('keydown', onKey);
      // Cleanup keyboard listener when screen leaves DOM (T-03-10)
      const observer = new MutationObserver(() => {
        if (!el.isConnected) { document.removeEventListener('keydown', onKey); observer.disconnect(); }
      });
      observer.observe(document.getElementById('app-main'), { childList: true });
    };

    // Stub renderer for unimplemented screens
    App.ui.renderStub = function(el, route) {
      const names = {
        'tarjetas': 'Tarjetas', 'opcion-multiple': 'Opción múltiple',
        'unir': 'Unir con flechas', 'completar': 'Completar la forma',
        'concordancia': 'Concordancia', 'escribir': 'Escribir',
        'clasificar': 'Clasificar', 'contrarreloj': 'Contrarreloj',
        'estadisticas': 'Estadísticas', 'configuracion': 'Configuración'
      };
      el.innerHTML = `
        <div style="padding: var(--sp-10) var(--sp-4); text-align: center; color: var(--text-muted);">
          <p style="font: 600 var(--text-lg) var(--font-display); color: var(--text-secondary); margin-bottom: var(--sp-3);">${names[route] || route}</p>
          <p style="font-size: var(--text-sm);">Disponible próximamente</p>
        </div>`;
    };

    /* === 7b. SELECTOR DE SESIÓN (SPEC §4.2) === */

    App.ui.renderSesion = function(el) {
      // Build category order and counts from vocab
      const catOrder = [];
      const catCounts = {};
      for (const w of App.state.vocab) {
        if (!catCounts[w.cat]) { catOrder.push(w.cat); catCounts[w.cat] = 0; }
        catCounts[w.cat]++;
      }

      // Load last session from localStorage — validate all fields (T-05-01)
      const savedSettings = Store.get('ivrit.v1.settings') || {};
      const raw = (savedSettings.lastSession && typeof savedSettings.lastSession === 'object') ? savedSettings.lastSession : {};
      const VALID_FILTERS    = ['todas', 'nuevas', 'dificiles', 'hoy'];
      const VALID_DIRECTIONS = ['es-he', 'he-es', 'mezclada'];
      const VALID_QUANTITIES = [10, 20, 30, 0];
      const state = {
        cats:      (Array.isArray(raw.cats) && raw.cats.every(c => typeof c === 'string')) ? raw.cats : catOrder.slice(),
        filter:    VALID_FILTERS.includes(raw.filter)       ? raw.filter    : 'todas',
        direction: VALID_DIRECTIONS.includes(raw.direction) ? raw.direction : 'es-he',
        quantity:  VALID_QUANTITIES.includes(raw.quantity)  ? raw.quantity  : 10
      };

      function saveState() {
        const settings = Store.get('ivrit.v1.settings') || {};
        settings.lastSession = { cats: state.cats.slice(), filter: state.filter, direction: state.direction, quantity: state.quantity };
        Store.set('ivrit.v1.settings', settings);
      }

      function getMatchingWords() {
        const selected = state.cats.length === 0 ? catOrder : state.cats;
        let words = App.state.vocab.filter(w => selected.includes(w.cat));
        const now = Date.now();
        const sevenDaysAgo = now - 7 * 24 * 60 * 60 * 1000;
        if (state.filter === 'nuevas') {
          words = words.filter(w => !App.state.progress[w.id] || App.state.progress[w.id].box === 0);
        } else if (state.filter === 'dificiles') {
          words = words.filter(w => {
            const p = App.state.progress[w.id];
            if (!p) return true; // unstarted = box 0 = difícil
            return p.box <= 2 || (p.lastWrong && p.lastWrong >= sevenDaysAgo);
          });
        } else if (state.filter === 'hoy') {
          words = words.filter(w => {
            const p = App.state.progress[w.id];
            return p && p.box > 0 && p.due <= now;
          });
        }
        return words;
      }

      function rerender() {
        saveState();
        App.ui.renderSesion(el);
      }

      const matching = getMatchingWords();
      const qty = state.quantity === 0 ? matching.length : state.quantity;
      const hasEnough = matching.length >= Math.min(qty, 1);
      const isInsufficient = state.quantity !== 0 && matching.length < state.quantity && matching.length > 0;

      // Build chip HTML helper
      function chip(label, selected, onclick, extraStyle) {
        const base = `border-radius:var(--radius-pill);padding:6px 14px;font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:36px;transition:background var(--dur-fast),border-color var(--dur-fast);`;
        const style = selected
          ? base + 'background:var(--blue-700);color:#fff;border:1.5px solid transparent;'
          : base + 'background:transparent;color:var(--text-secondary);border:1.5px solid var(--border);' + (extraStyle || '');
        return `<button onclick="${onclick}" style="${style}" aria-pressed="${selected}">${label}</button>`;
      }

      el.innerHTML = `
        <div class="screen-sesion">
          <header style="margin-bottom:var(--sp-5);">
            <h1 style="font:600 var(--text-4xl) var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-2);">Nueva sesión</h1>
            <p style="font-size:var(--text-sm);color:var(--text-muted);">Elige qué estudiar hoy</p>
          </header>

          <!-- Categories -->
          <section style="margin-bottom:var(--sp-6);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-3);">
              <h2 style="font:600 1.125rem var(--font-display);color:var(--text-primary);">Categorías</h2>
              <div style="display:flex;gap:var(--sp-2);">
                <button onclick="App.ui._sesionSelectAll()"
                  style="padding:4px 12px;border:1.5px solid var(--border);border-radius:var(--radius-pill);background:transparent;color:var(--text-secondary);font:600 var(--text-xs) var(--font-body);cursor:pointer;min-height:32px;transition:background var(--dur-fast);"
                  onmouseover="this.style.background='var(--blue-50)'" onmouseout="this.style.background='transparent'">Todas</button>
                <button onclick="App.ui._sesionSelectNone()"
                  style="padding:4px 12px;border:1.5px solid var(--border);border-radius:var(--radius-pill);background:transparent;color:var(--text-secondary);font:600 var(--text-xs) var(--font-body);cursor:pointer;min-height:32px;transition:background var(--dur-fast);"
                  onmouseover="this.style.background='var(--blue-50)'" onmouseout="this.style.background='transparent'">Ninguna</button>
              </div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:var(--sp-2);">
              ${catOrder.map(cat => {
                const sel = state.cats.includes(cat);
                // T-05-02: cat names from local vocab.json (trusted); apostrophes escaped
                const safecat = cat.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
                return `<button onclick="App.ui._sesionToggleCat('${safecat}')"
                  style="border-radius:var(--radius-pill);padding:6px 14px;font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:36px;transition:background var(--dur-fast),border-color var(--dur-fast);${sel?'background:var(--blue-700);color:#fff;border:1.5px solid transparent;':'background:transparent;color:var(--text-secondary);border:1.5px solid var(--border);'}"
                  aria-pressed="${sel}">
                  ${cat} <span style="opacity:.7;">${catCounts[cat]}</span>
                </button>`;
              }).join('')}
            </div>
          </section>

          <!-- Filter -->
          <section style="margin-bottom:var(--sp-5);">
            <h2 style="font:600 1.125rem var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-3);">Filtro</h2>
            <div style="display:flex;flex-wrap:wrap;gap:var(--sp-2);">
              ${[{val:'todas',label:'Todas'},{val:'nuevas',label:'Nuevas'},{val:'dificiles',label:'Difíciles'},{val:'hoy',label:'Para hoy'}].map(opt => {
                const sel = state.filter === opt.val;
                return `<button onclick="App.ui._sesionSetFilter('${opt.val}')"
                  style="border-radius:var(--radius-pill);padding:6px 14px;font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:36px;transition:background var(--dur-fast),border-color var(--dur-fast);${sel?'background:var(--blue-700);color:#fff;border:1.5px solid transparent;':'background:transparent;color:var(--text-secondary);border:1.5px solid var(--border);'}"
                  aria-pressed="${sel}">${opt.label}</button>`;
              }).join('')}
            </div>
          </section>

          <!-- Direction -->
          <section style="margin-bottom:var(--sp-5);">
            <h2 style="font:600 1.125rem var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-3);">Dirección</h2>
            <div style="display:flex;flex-wrap:wrap;gap:var(--sp-2);">
              ${[{val:'es-he',label:'ES → HE'},{val:'he-es',label:'HE → ES'},{val:'mezclada',label:'Mezclada'}].map(opt => {
                const sel = state.direction === opt.val;
                return `<button onclick="App.ui._sesionSetDirection('${opt.val}')"
                  style="border-radius:var(--radius-pill);padding:6px 14px;font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:36px;transition:background var(--dur-fast),border-color var(--dur-fast);${sel?'background:var(--blue-700);color:#fff;border:1.5px solid transparent;':'background:transparent;color:var(--text-secondary);border:1.5px solid var(--border);'}"
                  aria-pressed="${sel}">${opt.label}</button>`;
              }).join('')}
            </div>
          </section>

          <!-- Quantity -->
          <section style="margin-bottom:var(--sp-6);">
            <h2 style="font:600 1.125rem var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-3);">Cantidad</h2>
            <div style="display:flex;flex-wrap:wrap;gap:var(--sp-2);">
              ${[10,20,30,0].map(q => {
                const sel = state.quantity === q;
                const label = q === 0 ? 'Todas' : String(q);
                return `<button onclick="App.ui._sesionSetQuantity(${q})"
                  style="border-radius:var(--radius-pill);padding:6px 20px;font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:36px;transition:background var(--dur-fast),border-color var(--dur-fast);${sel?'background:var(--blue-700);color:#fff;border:1.5px solid transparent;':'background:transparent;color:var(--text-secondary);border:1.5px solid var(--border);'}"
                  aria-pressed="${sel}">${label}</button>`;
              }).join('')}
            </div>
          </section>

          <!-- Warning if insufficient words -->
          ${isInsufficient ? `
            <div style="padding:var(--sp-3) var(--sp-4);background:var(--amber-bg);border:1px solid var(--amber-light);border-radius:var(--radius-md);margin-bottom:var(--sp-4);font-size:var(--text-sm);color:var(--amber);">
              Solo hay ${matching.length} palabras con estos filtros. Se usarán todas.
            </div>` : ''}

          <!-- Empezar button -->
          <button ${!hasEnough ? 'disabled' : ''} onclick="App.ui._sesionEmpezar()"
            style="display:block;width:100%;padding:var(--sp-4);background:${hasEnough?'var(--blue-700)':'var(--border)'};color:${hasEnough?'var(--text-on-primary)':'var(--text-muted)'};border-radius:var(--radius-lg);font:700 var(--text-lg) var(--font-body);border:none;cursor:${hasEnough?'pointer':'not-allowed'};transition:background var(--dur-fast);margin-bottom:var(--sp-8);"
            ${hasEnough?'onmouseover="this.style.background=\'var(--blue-800)\'" onmouseout="this.style.background=\'var(--blue-700)\'"':''}
            aria-label="Empezar sesión con ${matching.length} palabras">
            ${hasEnough ? `Empezar · ${matching.length} palabras` : 'Sin palabras para este filtro'}
          </button>

          <div style="height:var(--sp-4);"></div>
        </div>`;

      // Attach handlers (closures over state + rerender)
      App.ui._sesionState = state;

      App.ui._sesionToggleCat = function(cat) {
        const idx = state.cats.indexOf(cat);
        if (idx >= 0) state.cats.splice(idx, 1);
        else state.cats.push(cat);
        rerender();
      };

      App.ui._sesionSelectAll = function() {
        state.cats = catOrder.slice();
        rerender();
      };

      App.ui._sesionSelectNone = function() {
        state.cats = [];
        rerender();
      };

      App.ui._sesionSetFilter = function(f) {
        state.filter = f;
        rerender();
      };

      App.ui._sesionSetDirection = function(d) {
        state.direction = d;
        rerender();
      };

      App.ui._sesionSetQuantity = function(q) {
        state.quantity = q;
        rerender();
      };

      App.ui._sesionEmpezar = function() {
        const mode = (App.session && App.session._pendingMode) || 'tarjetas';
        App.session.start(mode);
        location.hash = '#/' + mode;
      };
    };


    /* === 8. DICCIONARIO: SEARCH NORMALIZATION === */

    function normalizeSearch(str) {
      if (!str) return '';
      return String(str)
        .replace(/[֑-ׇ]/g, '')   // strip Hebrew niqqud/cantillation
        .normalize('NFD').replace(/[̀-ͯ]/g, '')  // strip Spanish accents
        .toLowerCase()
        .trim();
    }


    /* === 9. DICCIONARIO SCREEN (SPEC §4.12) === */

    App.ui.renderDiccionario = function(el) {
      // Group words by category, preserving original order from vocab
      const catOrder = [];
      const catMap = {};
      for (const w of App.state.vocab) {
        if (!catMap[w.cat]) { catMap[w.cat] = []; catOrder.push(w.cat); }
        catMap[w.cat].push(w);
      }

      // Column definitions per word kind
      const kindCols = {
        verb:     { cols: ['es','msg'],            heads: ['Español','<span lang="he" dir="rtl">פועל</span>'] },
        expr:     { cols: ['es','msg'],            heads: ['Español','<span lang="he" dir="rtl">ביטוי</span>'] },
        country:  { cols: ['es','msg','group'],    heads: ['Español','<span lang="he" dir="rtl">מדינה</span>','<span lang="he" dir="rtl">אזור</span>'] },
        gendered: { cols: ['es','msg','fsg','mpl','fpl'], heads: ['Español','<span lang="he" dir="rtl">יחיד</span>','<span lang="he" dir="rtl">יחידה</span>','<span lang="he" dir="rtl">רבים</span>','<span lang="he" dir="rtl">רבות</span>'] },
        noun:     { cols: ['es','msg','mpl'],      heads: ['Español','<span lang="he" dir="rtl">יחיד</span>','<span lang="he" dir="rtl">רבים</span>'] }
      };
      const heFields = new Set(['msg','fsg','mpl','fpl','group']);

      function renderWordTable(words) {
        if (!words.length) return '';
        const { cols, heads } = kindCols[words[0].kind] || kindCols.noun;
        const thRow = heads.map((h, i) =>
          `<th style="padding:var(--sp-2) var(--sp-3);text-align:${i===0?'left':'right'};font:600 var(--text-xs) var(--font-body);color:var(--text-muted);border-bottom:2px solid var(--border);white-space:nowrap;">${h}</th>`
        ).join('');
        const tbRows = words.map(w => {
          const box = (App.state.progress[w.id] && App.state.progress[w.id].box) || 0;
          const cells = cols.map(col => {
            const val = w[col];
            if (col === 'es') {
              return `<td style="padding:var(--sp-2) var(--sp-3);font-size:var(--text-sm);color:var(--text-primary);border-bottom:1px solid var(--border);">${val||'—'} <span class="box-chip" data-box="${box}">${box}</span></td>`;
            }
            if (heFields.has(col) && val) {
              return `<td style="padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border);text-align:right;">` +
                `<span class="he" lang="he" dir="rtl" style="font-size:calc(var(--he-scale)*0.875rem);">${val}</span>` +
                ` <button onclick="App.ui.showToast('Audio disponible en fases futuras')" aria-label="Pronunciar" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:0.875rem;vertical-align:middle;">🔊</button></td>`;
            }
            return `<td style="padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border);color:var(--text-secondary);font-size:var(--text-sm);text-align:${heFields.has(col)?'right':'left'};">${val||'—'}</td>`;
          }).join('');
          return `<tr>${cells}</tr>`;
        }).join('');
        return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;"><table style="width:100%;border-collapse:collapse;font-size:var(--text-sm);"><thead><tr>${thRow}</tr></thead><tbody>${tbRows}</tbody></table></div>`;
      }

      function renderResults(query) {
        const norm = normalizeSearch(query);
        if (!norm) {
          // Default: all categories collapsed
          return catOrder.map(cat => {
            const words = catMap[cat];
            return `<details class="dict-cat" style="border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:var(--sp-3);overflow:hidden;">
              <summary style="padding:var(--sp-4);cursor:pointer;font:600 1rem var(--font-display);color:var(--text-primary);display:flex;justify-content:space-between;align-items:center;list-style:none;user-select:none;background:var(--surface);">
                <span>${cat}</span>
                <span style="font:400 var(--text-sm) var(--font-body);color:var(--text-muted);">${words.length} palabras</span>
              </summary>
              <div style="padding:0 var(--sp-1) var(--sp-2);">${renderWordTable(words)}</div>
            </details>`;
          }).join('');
        }
        // Search mode: flat list grouped by category heading
        const matched = [];
        for (const cat of catOrder) {
          const hits = catMap[cat].filter(w =>
            normalizeSearch(w.es).includes(norm)  ||
            normalizeSearch(w.msg).includes(norm) ||
            normalizeSearch(w.fsg).includes(norm) ||
            normalizeSearch(w.mpl).includes(norm) ||
            normalizeSearch(w.fpl).includes(norm)
          );
          if (hits.length) matched.push({ cat, hits });
        }
        if (!matched.length) {
          // T-04-01: escape query via textContent before inserting into DOM
          const safe = document.createElement('span');
          safe.textContent = query;
          return `<div style="padding:var(--sp-10) var(--sp-4);text-align:center;">
            <p style="color:var(--text-muted);margin-bottom:var(--sp-4);">Sin resultados para "<strong>${safe.innerHTML}</strong>"</p>
            <button onclick="document.getElementById('dict-search').value='';App.ui._dictUpdate('')"
              style="padding:var(--sp-2) var(--sp-5);border:1.5px solid var(--border);border-radius:var(--radius-pill);background:transparent;color:var(--text-secondary);font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:44px;">
              Limpiar búsqueda
            </button>
          </div>`;
        }
        return matched.map(({ cat, hits }) =>
          `<div style="margin-bottom:var(--sp-5);">
            <h3 style="font:600 1rem var(--font-display);color:var(--text-primary);padding:var(--sp-2) 0;border-bottom:1px solid var(--border);margin-bottom:var(--sp-2);">${cat}</h3>
            ${renderWordTable(hits)}
          </div>`
        ).join('');
      }

      el.innerHTML = `
        <div class="screen-diccionario">
          <header style="margin-bottom:var(--sp-5);">
            <h1 style="font:600 var(--text-4xl) var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-4);">Diccionario</h1>
            <div style="position:relative;">
              <input id="dict-search" type="search" placeholder="Buscar en español o hebreo…"
                oninput="App.ui._dictUpdate(this.value)"
                style="width:100%;padding:var(--sp-3) var(--sp-4) var(--sp-3) calc(var(--sp-4) + 20px);border:1.5px solid var(--border);border-radius:var(--radius-pill);background:var(--surface);color:var(--text-primary);font:400 var(--text-base) var(--font-body);outline:none;transition:border-color var(--dur-fast);min-height:44px;"
                onfocus="this.style.borderColor='var(--blue-700)'" onblur="this.style.borderColor='var(--border)'"
                aria-label="Buscar palabras">
              <svg style="position:absolute;left:var(--sp-4);top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
          </header>
          <div id="dict-results">${renderResults('')}</div>
          <div style="height:var(--sp-8);"></div>
        </div>`;

      App.ui._dictUpdate = function(query) {
        document.getElementById('dict-results').innerHTML = renderResults(query);
      };
    };


    /* === 10. INICIO SCREEN === */

    App.ui.renderInicio = function(el) {
      // Compute summary counts
      const prog   = App.state.progress;
      const total  = App.state.vocab.length;
      const progEntries = Object.values(prog);
      const mastered    = progEntries.filter(p => p.box === 5).length;
      const now         = Date.now();
      const dueToday    = progEntries.filter(p => p.box > 0 && p.due <= now).length;
      const inProgress  = progEntries.filter(p => p.box > 0).length;
      const newWords    = total - inProgress;
      const streak      = (App.state.stats && App.state.stats.streak) || 0;

      // Last sync date
      const cache = (function() {
        try { const v = localStorage.getItem('ivrit.v1.vocabCache'); return v ? JSON.parse(v) : null; } catch { return null; }
      })();
      const lastSync = cache && cache.updated
        ? new Date(cache.updated).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' })
        : 'Nunca';

      // Category progress bars — group vocab by category, count per box
      const catData = {};
      for (const w of App.state.vocab) {
        if (!catData[w.cat]) catData[w.cat] = { name: w.cat, counts: [0,0,0,0,0,0] };
        const box = (prog[w.id] && prog[w.id].box) || 0;
        catData[w.cat].counts[box]++;
      }
      const cats = Object.values(catData);

      // Mode grid: all 10 modes, all unavailable in Phase 1
      const modes = [
        { id: 'tarjetas',        icon: '🃏', name: 'Tarjetas',           desc: 'Memoriza con flashcards',           available: true },
        { id: 'opcion-multiple', icon: '❓', name: 'Opción múltiple',    desc: 'Elige la traducción correcta',      available: true },
        { id: 'unir',            icon: '↔',  name: 'Unir con flechas',   desc: 'Conecta pares español-hebreo',      available: false },
        { id: 'escribir',        icon: '✍',  name: 'Escribir',           desc: 'Escribe la traducción en hebreo',   available: false },
        { id: 'completar',       icon: '📝', name: 'Completar la forma', desc: 'Completa la forma correcta',        available: false },
        { id: 'concordancia',    icon: '🔤', name: 'Concordancia',       desc: 'Elige la forma según el pronombre', available: false },
        { id: 'clasificar',      icon: '📂', name: 'Clasificar',         desc: 'Arrastra palabras a sus grupos',    available: false },
        { id: 'contrarreloj',    icon: '⏱',  name: 'Contrarreloj',       desc: 'Responde en 60 segundos',           available: false },
        { id: 'repaso-errores',  icon: '🔁', name: 'Repaso de errores',  desc: 'Practica lo que fallaste',          available: false },
        { id: 'repaso-dia',      icon: '📅', name: 'Repaso del día',     desc: 'Palabras espaciadas de hoy',        available: false },
      ];

      // Box colors for stacked progress bars (box 0–5)
      const boxColors = ['var(--border)','#FFE4E4','var(--amber-light)','var(--blue-100)','var(--green-light)','var(--gold-light)'];

      el.innerHTML = `
        <div class="screen-inicio" style="padding-top: var(--sp-4);">

          <!-- Header -->
          <header style="margin-bottom: var(--sp-5);">
            <h1 style="font: 600 var(--text-4xl) var(--font-display); color: var(--text-primary); margin-bottom: var(--sp-1);">Ivrit</h1>
            <p style="font-size: var(--text-sm); color: var(--text-muted);">Vocabulario hebreo</p>
          </header>

          <!-- Summary stats: 3-col grid (wraps 5 cards) -->
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-5);">
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); text-align: center; box-shadow: var(--shadow-sm);">
              <div style="font: 700 var(--text-3xl) var(--font-display); color: var(--blue-700);">${total}</div>
              <div style="font: 600 var(--text-xs) var(--font-body); color: var(--text-muted); margin-top: var(--sp-1);">Total</div>
            </div>
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); text-align: center; box-shadow: var(--shadow-sm);">
              <div style="font: 700 var(--text-3xl) var(--font-display); color: var(--gold);">${mastered}</div>
              <div style="font: 600 var(--text-xs) var(--font-body); color: var(--text-muted); margin-top: var(--sp-1);">Dominadas</div>
            </div>
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); text-align: center; box-shadow: var(--shadow-sm);">
              <div style="font: 700 var(--text-3xl) var(--font-display); color: var(--amber);">${dueToday}</div>
              <div style="font: 600 var(--text-xs) var(--font-body); color: var(--text-muted); margin-top: var(--sp-1);">Para hoy</div>
            </div>
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); text-align: center; box-shadow: var(--shadow-sm);">
              <div style="font: 700 var(--text-3xl) var(--font-display); color: var(--blue-500);">${newWords}</div>
              <div style="font: 600 var(--text-xs) var(--font-body); color: var(--text-muted); margin-top: var(--sp-1);">Nuevas</div>
            </div>
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); text-align: center; box-shadow: var(--shadow-sm);">
              <div style="font: 700 var(--text-3xl) var(--font-display); color: var(--green);">${streak}</div>
              <div style="font: 600 var(--text-xs) var(--font-body); color: var(--text-muted); margin-top: var(--sp-1);">Racha 🔥</div>
            </div>
          </div>

          <!-- Repaso del día (prominent button) -->
          <button onclick="App.ui.showToast('Repaso del día disponible próximamente')"
            style="display: block; width: 100%; padding: var(--sp-4) var(--sp-6); background: var(--blue-700); color: var(--text-on-primary); border-radius: var(--radius-lg); font: 700 var(--text-lg) var(--font-body); box-shadow: var(--shadow-md); margin-bottom: var(--sp-6); cursor: pointer; border: none; transition: opacity var(--dur-fast);"
            onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'"
            aria-label="Iniciar repaso del día">
            📅 Repaso del día
          </button>

          <!-- Mode grid -->
          <section aria-labelledby="modos-heading" style="margin-bottom: var(--sp-8);">
            <h2 id="modos-heading" style="font: 600 1.375rem var(--font-display); color: var(--text-primary); margin-bottom: var(--sp-4);">Modos de estudio</h2>
            <div class="mode-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-3);">
              ${modes.map(m => `
                <div class="mode-card"
                  style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); box-shadow: var(--shadow-sm); ${!m.available ? 'opacity: 0.45; pointer-events: none;' : 'cursor: pointer;'}"
                  ${m.available ? `onclick="App.session._pendingMode='${m.id}';location.hash='#/sesion'" role="button" tabindex="0" aria-label="${m.name}"` : 'aria-hidden="true"'}>
                  <div style="font-size: 1.75rem; margin-bottom: var(--sp-2);" aria-hidden="true">${m.icon}</div>
                  <div style="font: 600 1rem var(--font-display); color: var(--text-primary); margin-bottom: var(--sp-1);">${m.name}</div>
                  <div style="font: 400 var(--text-xs) var(--font-body); color: var(--text-secondary);">${m.desc}</div>
                </div>`).join('')}
            </div>
          </section>

          <!-- Category progress bars -->
          <section aria-labelledby="cats-heading" style="margin-bottom: var(--sp-8);">
            <h2 id="cats-heading" style="font: 600 1.375rem var(--font-display); color: var(--text-primary); margin-bottom: var(--sp-4);">Progreso por categoría</h2>
            <div>
              ${cats.map(cat => {
                const catTotal = cat.counts.reduce((a, b) => a + b, 0);
                const bars = cat.counts.map((count, box) => {
                  const pct = catTotal > 0 ? (count / catTotal) * 100 : 0;
                  return pct > 0 ? `<div style="width:${pct.toFixed(1)}%; background:${boxColors[box]}; height:100%;" title="Caja ${box}: ${count}"></div>` : '';
                }).join('');
                return `
                  <div style="margin-bottom: var(--sp-3);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                      <span style="font: 600 var(--text-sm) var(--font-body); color: var(--text-primary);">${cat.name}</span>
                      <span style="font: 400 var(--text-xs) var(--font-body); color: var(--text-muted);">${catTotal}</span>
                    </div>
                    <div style="height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; display: flex;">${bars}</div>
                  </div>`;
              }).join('')}
            </div>
          </section>

          <!-- Sync section -->
          <section style="margin-bottom: var(--sp-8); padding: var(--sp-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--sp-3);">
              <span style="font: 400 var(--text-sm) var(--font-body); color: var(--text-muted);">Última sincronización: <strong id="sync-last-date" style="color: var(--text-secondary);">${lastSync}</strong></span>
              <button onclick="App.ui.syncRun(this)"
                style="padding: var(--sp-2) var(--sp-4); border: 1.5px solid var(--border); border-radius: var(--radius-pill); background: transparent; color: var(--text-secondary); font: 600 var(--text-sm) var(--font-body); cursor: pointer; min-height: 44px; transition: background var(--dur-fast);"
                onmouseover="this.style.background='var(--surface-hover)'" onmouseout="this.style.background='transparent'"
                aria-label="Sincronizar con Google Docs">
                🔄 Sincronizar
              </button>
            </div>
          </section>

        </div>`;

      // Responsive mode grid: 3 cols on desktop
      if (!document.getElementById('inicio-grid-style')) {
        const s = document.createElement('style');
        s.id = 'inicio-grid-style';
        s.textContent = '@media (min-width: 600px) { .mode-grid { grid-template-columns: repeat(3, 1fr) !important; } }';
        document.head.appendChild(s);
      }
    };


    /* === 11. ARRANQUE === */

    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
