    /* === 5. DATOS: NORMALIZACIÓN Y CARGA === */

    /**
     * Mapeo encabezado hebreo → campo normalizado (SPEC §2.2).
     * Por texto, no por posición.
     */
    const HEADER_MAP = {
      'תרגום': 'es',
      'יחיד':  'msg',
      'רבים':  'mpl',
      'יחידה': 'fsg',
      'רבות':  'fpl',
      'פועל':  'msg',   // verbo infinitivo → msg
      'ביטוי': 'msg',   // expresión → msg
      'מדינה': 'msg',   // nombre de país → msg
      'אזור':  'group', // región (país)
      'תחום':  'group', // área (profesión)
    };

    /** Convierte una categoría en su kind según los encabezados (SPEC §2.3). */
    function detectKind(headerSet) {
      if (headerSet.has('פועל'))  return 'verb';
      if (headerSet.has('ביטוי')) return 'expr';
      if (headerSet.has('מדינה')) return 'country';
      if (headerSet.has('יחידה') || headerSet.has('רבות')) return 'gendered';
      return 'noun';
    }

    /** Convierte string a slug URL-safe (sin acentos, lowercase, guiones). */
    function slugify(str) {
      return String(str).normalize('NFD').replace(/[̀-ͯ]/g, '')
        .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    /**
     * Normaliza el JSON crudo de vocab.json → array de word objects (SPEC §2.2–2.4).
     * Función pura: no toca App.state.
     * @param {object} rawData — objeto con .categories[]
     * @returns {Array} words[]
     */
    App.data.normalize = function(rawData) {
      // Fusionar categorías con el mismo nombre (SPEC §2.1)
      const merged = [];
      const catIdx = {};
      for (const cat of rawData.categories) {
        if (catIdx[cat.name] !== undefined) {
          merged[catIdx[cat.name]].rows.push(...cat.rows);
        } else {
          catIdx[cat.name] = merged.length;
          merged.push({ name: cat.name, headers: cat.headers, rows: [...cat.rows] });
        }
      }

      const words = [];
      for (const cat of merged) {
        const catSlug  = slugify(cat.name);
        const headerSet = new Set(cat.headers);
        const kind      = detectKind(headerSet);
        const seenBase  = {};  // baseId → true, para detectar duplicados

        for (const row of cat.rows) {
          const word = {
            id: '', cat: cat.name, kind,
            es: '', msg: null, mpl: null, fsg: null, fpl: null, group: null, extra: {}
          };

          for (let i = 0; i < cat.headers.length; i++) {
            const header = cat.headers[i];
            const raw    = row[i];
            // "—" o vacío → null (SPEC §2.4)
            const val = (raw === '—' || raw === undefined || raw === null || String(raw).trim() === '')
              ? null : String(raw).trim();
            const field = HEADER_MAP[header];
            if (field) {
              word[field] = val;
            } else {
              word.extra[header] = val;
            }
          }

          // ID estable: slug(cat)::slug(es) [+ ::slug(msg) si hay duplicado] (SPEC §2.4)
          const baseId = catSlug + '::' + slugify(word.es || '');
          if (seenBase[baseId]) {
            word.id = baseId + '::' + slugify(word.msg || '');
          } else {
            word.id    = baseId;
            seenBase[baseId] = true;
          }

          words.push(word);
        }
      }
      return words;
    };

    /**
     * Carga vocab.json (o caché de localStorage si es más nueva),
     * normaliza y puebla App.state.vocab. (SPEC §3)
     */
    App.data.load = async function() {
      let raw = null;

      try {
        const resp = await fetch('./vocab.json');
        if (resp.ok) raw = await resp.json();
      } catch (_) { /* sin red / file:// — caerá a caché */ }

      const cache = Store.get('ivrit.v1.vocabCache');

      if (raw && cache && cache.updated && raw.updated && cache.updated >= raw.updated) {
        // Caché más nueva o igual → usar caché
        raw = cache.raw;
      } else if (raw) {
        // Archivo más nuevo → actualizar caché
        Store.set('ivrit.v1.vocabCache', { raw, updated: raw.updated || new Date().toISOString() });
      } else if (cache && cache.raw) {
        // Fetch falló, usar caché
        App.ui.showToast('Usando vocabulario guardado en caché');
        raw = cache.raw;
      } else {
        // Todo falló
        App.ui.showToast('No se pudo cargar el vocabulario');
        App.state.vocab = [];
        return;
      }

      try {
        App.state.vocab = App.data.normalize(raw);
      } catch (_) {
        App.ui.showToast('Error al procesar el vocabulario');
        App.state.vocab = [];
        return;
      }

      // Restaurar progreso y settings persistidos
      App.state.progress = Store.get('ivrit.v1.progress') || {};
      App.state.stats    = Store.get('ivrit.v1.stats')    || {};
      const saved = Store.get('ivrit.v1.settings') || {};
      Object.assign(App.state.settings, saved);
    };


    /* === 5b. SINCRONIZACIÓN === */

    App.sync = {};

    App.sync.fetchWithTimeout = async function(url, ms) {
      if (!navigator.onLine) throw Object.assign(new Error('sin conexión'), { code: 'offline' });
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      try {
        const resp = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!resp.ok) throw Object.assign(new Error('URL no responde'), { code: 'timeout' });
        return await resp.json();
      } catch (err) {
        clearTimeout(timer);
        if (err.code) throw err;
        if (err.name === 'AbortError') throw Object.assign(new Error('La URL no respondió en 20 s'), { code: 'timeout' });
        throw Object.assign(new Error('sin conexión'), { code: 'offline' });
      }
    };

    App.sync.validateRaw = function(data) {
      return !!(data &&
        data.source === 'google-docs' &&
        Array.isArray(data.categories) &&
        data.categories.length > 0 &&
        data.categories.every(c =>
          typeof c.name === 'string' &&
          Array.isArray(c.headers) &&
          Array.isArray(c.rows)
        )
      );
    };

    App.sync.diffVocab = function(oldWords, newWords) {
      const oldMap = new Map(oldWords.map(w => [w.id, w]));
      const newMap = new Map(newWords.map(w => [w.id, w]));
      const FIELDS = ['es', 'msg', 'mpl', 'fsg', 'fpl', 'group'];

      const added    = newWords.filter(w => !oldMap.has(w.id));
      const deleted  = oldWords.filter(w => !newMap.has(w.id));
      const modified = newWords.filter(w => {
        const old = oldMap.get(w.id);
        if (!old) return false;
        return FIELDS.some(f => w[f] !== old[f]);
      });

      return { added, modified, deleted };
    };

    App.sync.applyDiff = function(diff, rawData) {
      // Added: push to vocab (no progress entry = box 0 by default)
      diff.added.forEach(w => App.state.vocab.push(w));

      // Modified: replace in-place, preserve progress
      diff.modified.forEach(w => {
        const idx = App.state.vocab.findIndex(v => v.id === w.id);
        if (idx !== -1) App.state.vocab[idx] = w;
      });

      // Deleted: remove from vocab, keep progress (SYNC-04)
      diff.deleted.forEach(w => {
        const idx = App.state.vocab.findIndex(v => v.id === w.id);
        if (idx !== -1) App.state.vocab.splice(idx, 1);
      });

      // Persist updated cache
      Store.set('ivrit.v1.vocabCache', {
        raw: rawData,
        updated: rawData.updated || new Date().toISOString()
      });
    };

    App.sync.run = async function() {
      let raw;
      try {
        raw = await App.sync.fetchWithTimeout(APPS_SCRIPT_URL, 20000);
      } catch (err) {
        throw { code: err.code || 'offline', message: err.message };
      }
      if (!App.sync.validateRaw(raw)) {
        throw { code: 'invalid', message: 'El formato de la respuesta no es válido' };
      }
      let newWords;
      try {
        newWords = App.data.normalize(raw);
      } catch (_) {
        throw { code: 'invalid', message: 'Error al procesar los datos recibidos' };
      }
      const diff = App.sync.diffVocab(App.state.vocab, newWords);
      App.sync.applyDiff(diff, raw);
      return { diff, updatedAt: raw.updated || new Date().toISOString() };
    };


    /* === 6b. SESSION ENGINE === */

    App.session.start = function(mode) {
      const st = App.ui._sesionState;   // { cats, filter, direction, quantity }
      const catOrder = [];
      const catSeen = new Set();
      for (const w of App.state.vocab) { if (!catSeen.has(w.cat)) { catOrder.push(w.cat); catSeen.add(w.cat); } }
      const selected = st.cats.length === 0 ? catOrder : st.cats;
      const now = Date.now();
      const sevenDaysAgo = now - 7 * 24 * 60 * 60 * 1000;
      let words = App.state.vocab.filter(w => selected.includes(w.cat));
      if (st.filter === 'nuevas') {
        words = words.filter(w => !App.state.progress[w.id] || App.state.progress[w.id].box === 0);
      } else if (st.filter === 'dificiles') {
        words = words.filter(w => { const p = App.state.progress[w.id]; if (!p) return true; return p.box <= 2 || (p.lastWrong && p.lastWrong >= sevenDaysAgo); });
      } else if (st.filter === 'hoy') {
        words = words.filter(w => { const p = App.state.progress[w.id]; return p && p.box > 0 && p.due <= now; });
      }
      // Filtrar por variante para modo unir (D-05)
      if (mode === 'unir') {
        const variant = App.session._matchVariant || 'es-he';
        if (variant === 'sg-pl') {
          words = words.filter(w => w.mpl && w.mpl !== w.msg);
        } else if (variant === 'masc-fem') {
          words = words.filter(w => w.kind === 'gendered');
        }
        // 'es-he' no requiere filtro adicional
      }
      // Shuffle (Fisher-Yates)
      for (let i = words.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [words[i], words[j]] = [words[j], words[i]];
      }
      const qty = st.quantity === 0 ? words.length : st.quantity;
      const startFn = App.session.start;  // preserve reference before replacing object
      App.session = {
        mode,
        words: words.slice(0, qty),
        index: 0,
        direction: st.direction,
        results: [],   // { wordId, correct: bool }
        _matchVariant: App.session._matchVariant,  // preserve for renderUnir (D-05/WR-01)
        _pendingMode:  mode
      };
      App.session.start = startFn;  // re-attach so subsequent calls still work
    };

    App.ui.updateProgress = function(wordId, correct) {
      const p = App.state.progress[wordId] || { box: 0, due: 0, seen: 0, correct: 0, wrong: 0, lastWrong: null, streak: 0 };
      p.seen++;
      if (correct) {
        p.correct++;
        p.streak = (p.streak || 0) + 1;
        p.box = Math.min(p.box + 1, 5);          // per LEIT-02: sube una caja
      } else {
        p.wrong++;
        p.streak = 0;
        p.lastWrong = Date.now();
        p.box = 1;                                 // per LEIT-02: vuelve a caja 1
      }
      // Leitner intervals (Stage 5)
      const LEITNER_MS = [0, 0, 86400000, 259200000, 604800000, 1382400000]; // box 0-5
      const now5 = Date.now();
      if (correct) {
        if (p.box >= 5) {
          p.due = now5 + 2592000000; // box 5 correct → 30 days
        } else {
          p.due = now5 + (LEITNER_MS[p.box] || 0);
        }
      } else {
        p.due = now5; // box 1 → due now
      }
      App.state.progress[wordId] = p;
      Store.set('ivrit.v1.progress', App.state.progress);  // persist after every answer
      _recordSession();
    };

    /**
     * Renders session result screen. Called by renderTarjetas and renderOpcionMultiple.
     * @param {HTMLElement} el — screen container
     */
    App.ui.renderResultado = function(el) {
      const { results, words, mode } = App.session;
      const total   = results.length;
      const correct = results.filter(r => r.correct).length;
      const wrong   = results.filter(r => !r.correct);

      el.innerHTML = '';

      // Header
      const header = document.createElement('header');
      header.style.cssText = 'padding:var(--sp-8) var(--sp-4) var(--sp-6);text-align:center;';
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      const title = document.createElement('h1');
      title.style.cssText = 'font:600 3rem var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-2);';
      title.textContent = pct >= 80 ? '¡Muy bien!' : pct >= 50 ? 'Buen progreso' : 'Sigue practicando';
      header.appendChild(title);

      const sub = document.createElement('p');
      sub.style.cssText = 'font:400 var(--text-base) var(--font-body);color:var(--text-muted);';
      sub.textContent = correct + ' de ' + total + ' correctas (' + pct + '%)';
      header.appendChild(sub);
      el.appendChild(header);

      // Wrong words list
      if (wrong.length > 0) {
        const section = document.createElement('section');
        section.style.cssText = 'padding:0 var(--sp-4);margin-bottom:var(--sp-6);';
        const h2 = document.createElement('h2');
        h2.style.cssText = 'font:600 1.125rem var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-3);';
        h2.textContent = 'Palabras a repasar (' + wrong.length + ')';
        section.appendChild(h2);

        const list = document.createElement('ul');
        list.style.cssText = 'list-style:none;display:flex;flex-direction:column;gap:var(--sp-2);';
        for (const r of wrong) {
          const w = App.state.vocab.find(v => v.id === r.wordId);
          if (!w) continue;
          const li = document.createElement('li');
          li.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:var(--sp-3) var(--sp-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);gap:var(--sp-3);';
          const esSpan = document.createElement('span');
          esSpan.style.cssText = 'font:600 var(--text-sm) var(--font-body);color:var(--text-primary);';
          esSpan.textContent = w.es;    // textContent — XSS safe
          const heSpan = document.createElement('span');
          heSpan.lang = 'he'; heSpan.dir = 'rtl';
          heSpan.style.cssText = 'font-family:var(--font-hebrew);font-size:calc(var(--he-scale)*0.95rem);color:var(--text-secondary);';
          heSpan.textContent = w.msg || '';  // textContent — XSS safe
          li.appendChild(esSpan);
          li.appendChild(heSpan);
          list.appendChild(li);
        }
        section.appendChild(list);
        el.appendChild(section);
      }

      // Action buttons
      const btnArea = document.createElement('div');
      btnArea.style.cssText = 'padding:0 var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);';

      // "Repetir las que no sabia" — only if there are wrong words
      if (wrong.length > 0) {
        const retryBtn = document.createElement('button');
        retryBtn.style.cssText = 'display:block;width:100%;padding:var(--sp-4);background:var(--blue-700);color:#fff;border-radius:var(--radius-lg);font:700 var(--text-lg) var(--font-body);border:none;cursor:pointer;transition:background var(--dur-fast);';
        retryBtn.textContent = 'Repetir las que no sabia (' + wrong.length + ')';
        retryBtn.setAttribute('aria-label', 'Repetir ' + wrong.length + ' palabras incorrectas');
        retryBtn.addEventListener('mouseenter', () => { retryBtn.style.background = 'var(--blue-800)'; });
        retryBtn.addEventListener('mouseleave', () => { retryBtn.style.background = 'var(--blue-700)'; });
        retryBtn.addEventListener('click', () => {
          // Start a new session with only the wrong words
          App.session.words  = wrong.map(r => App.state.vocab.find(v => v.id === r.wordId)).filter(Boolean);
          App.session.index  = 0;
          App.session.results = [];
          // Navigate to the same mode
          location.hash = '#/' + (App.session.mode || 'tarjetas');
        });
        btnArea.appendChild(retryBtn);
      }

      const newBtn = document.createElement('button');
      newBtn.style.cssText = 'display:block;width:100%;padding:var(--sp-3) var(--sp-4);border:1.5px solid var(--border);border-radius:var(--radius-lg);font:600 var(--text-base) var(--font-body);background:transparent;color:var(--text-secondary);cursor:pointer;transition:background var(--dur-fast);';
      newBtn.textContent = 'Nueva sesion';
      newBtn.addEventListener('mouseenter', () => { newBtn.style.background = 'var(--surface-hover)'; });
      newBtn.addEventListener('mouseleave', () => { newBtn.style.background = 'transparent'; });
      newBtn.addEventListener('click', () => { location.hash = '#/sesion'; });
      btnArea.appendChild(newBtn);

      el.appendChild(btnArea);
    };


    /* === 7. TARJETAS SCREEN (SPEC §4.3, FLAS-01..06) === */

    App.ui.renderTarjetas = function(el) {
      if (!App.session || !App.session.words || App.session.words.length === 0) {
        location.hash = '#/sesion'; return;
      }
      // Session end check
      if (App.session.index >= App.session.words.length) {
        App.ui.renderResultado(el); return;
      }

      const total = App.session.words.length;
      const idx   = App.session.index;
      const word  = App.session.words[idx];
      const pct   = (idx / total) * 100;

      // Determine front/back direction
      const dir = App.session.direction === 'mezclada'
        ? (Math.random() < 0.5 ? 'es-he' : 'he-es')
        : App.session.direction;
      App.session._cardDir = dir;

      const frontText  = dir === 'es-he' ? word.es : (word.msg || word.es);
      const frontIsHe  = dir === 'he-es';

      // Build back content per kind (SPEC §4.3)
      function addRow(table, labelHe, valHe, isHe) {
        const tr = document.createElement('tr');
        const tdLabel = document.createElement('td');
        tdLabel.style.cssText = 'padding:4px 0;color:rgba(255,255,255,.60);font-size:var(--text-xs);width:60px;';
        if (isHe) { tdLabel.lang = 'he'; tdLabel.dir = 'rtl'; tdLabel.style.fontFamily = 'var(--font-hebrew)'; }
        tdLabel.textContent = labelHe;
        const tdVal = document.createElement('td');
        tdVal.style.cssText = 'padding:4px 0;text-align:right;';
        if (isHe) {
          tdVal.lang = 'he'; tdVal.dir = 'rtl';
          tdVal.style.fontFamily = 'var(--font-hebrew)';
          tdVal.style.fontSize = 'calc(var(--he-scale)*1rem)';
          tdVal.style.direction = 'rtl';
        }
        tdVal.textContent = valHe;
        tr.appendChild(tdLabel);
        tr.appendChild(tdVal);
        table.appendChild(tr);
      }

      function buildBack() {
        const div = document.createElement('div');
        div.style.cssText = 'padding:var(--sp-6);color:var(--text-on-primary);';

        // Main Hebrew form large
        const mainEl = document.createElement('p');
        mainEl.lang = 'he'; mainEl.dir = 'rtl';
        mainEl.style.cssText = 'font-family:var(--font-hebrew);font-size:calc(var(--he-scale)*2rem);font-weight:700;direction:rtl;text-align:right;margin-bottom:var(--sp-4);line-height:1.2;';
        mainEl.textContent = word.msg || '';
        div.appendChild(mainEl);

        // Spanish translation
        const transEl = document.createElement('p');
        transEl.style.cssText = 'font:600 var(--text-lg) var(--font-body);color:rgba(255,255,255,.85);margin-bottom:var(--sp-4);';
        transEl.textContent = word.es;
        div.appendChild(transEl);

        // Forms table by kind
        const table = document.createElement('table');
        table.style.cssText = 'width:100%;border-collapse:collapse;margin-bottom:var(--sp-4);font-size:calc(var(--he-scale)*0.875rem);';

        if (word.kind === 'noun') {
          if (word.msg)  addRow(table, 'יחיד', word.msg, true);
          if (word.mpl && word.mpl !== word.msg) addRow(table, 'רבים', word.mpl, true);
        } else if (word.kind === 'gendered') {
          if (word.msg)  addRow(table, 'יחיד', word.msg, true);
          if (word.fsg)  addRow(table, 'יחידה', word.fsg, true);
          if (word.mpl && word.mpl !== word.msg) addRow(table, 'רבים', word.mpl, true);
          if (word.fpl)  addRow(table, 'רבות', word.fpl, true);
        } else if (word.kind === 'verb') {
          if (word.msg)  addRow(table, 'פועל', word.msg, true);
        } else if (word.kind === 'country') {
          if (word.msg)  addRow(table, 'מדינה', word.msg, true);
          if (word.group) addRow(table, 'אזור', word.group, true);
        } else {
          // expr and fallback
          if (word.msg)  addRow(table, 'ביטוי', word.msg, true);
        }
        for (const [k, v] of Object.entries(word.extra || {})) {
          if (v) addRow(table, k, v, false);
        }
        div.appendChild(table);
        return div;
      }

      // Build screen DOM (textContent only — no innerHTML with word data, T-03-04)
      el.innerHTML = '';

      // Progress bar (DESIGN.md §3.7)
      const progBar  = document.createElement('div');
      progBar.className = 'session-progress';
      const progFill = document.createElement('div');
      progFill.className = 'session-progress-fill';
      progFill.style.width = pct + '%';
      progBar.appendChild(progFill);
      el.appendChild(progBar);

      // Counter
      const counter = document.createElement('p');
      counter.style.cssText = 'text-align:center;font:600 var(--text-sm) var(--font-body);color:var(--text-muted);padding:var(--sp-6) var(--sp-4) var(--sp-3);';
      counter.textContent = (idx + 1) + ' / ' + total;
      el.appendChild(counter);

      // Card scene (DESIGN.md §3.1)
      const scene = document.createElement('div');
      scene.className = 'card-scene';
      scene.style.cssText = 'padding:0 var(--sp-4);margin-bottom:var(--sp-5);';

      const card = document.createElement('div');
      card.className = 'card';
      card.style.cssText = 'position:relative;min-height:260px;border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);cursor:pointer;';
      card.setAttribute('aria-label', 'Tarjeta. Toca para ver la respuesta.');
      card.setAttribute('tabindex', '0');
      card.setAttribute('role', 'button');

      // Front face
      const front = document.createElement('div');
      front.className = 'card-front';
      front.style.cssText = 'position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-xl);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--sp-6);';

      // Alef watermark
      const wm = document.createElement('span');
      wm.setAttribute('aria-hidden', 'true');
      wm.style.cssText = 'position:absolute;font-family:var(--font-hebrew);font-size:min(40vw,180px);opacity:.04;color:var(--blue-700);pointer-events:none;user-select:none;line-height:1;';
      wm.textContent = 'א';
      front.appendChild(wm);

      // Category chip
      const catChip = document.createElement('span');
      catChip.style.cssText = 'position:absolute;top:var(--sp-4);left:var(--sp-4);font:600 var(--text-xs) var(--font-body);background:var(--blue-50);color:var(--blue-700);border-radius:var(--radius-pill);padding:2px 8px;';
      catChip.textContent = word.cat;
      front.appendChild(catChip);

      // Box chip (Leitner)
      const prog = App.state.progress[word.id];
      const box  = prog ? prog.box : 0;
      const boxChipEl = document.createElement('span');
      boxChipEl.className = 'box-chip';
      boxChipEl.setAttribute('data-box', box);
      boxChipEl.style.cssText += 'position:absolute;top:var(--sp-4);right:var(--sp-4);';
      boxChipEl.textContent = 'Caja ' + box;
      front.appendChild(boxChipEl);

      // Front word
      const frontWord = document.createElement('div');
      if (frontIsHe) {
        frontWord.lang = 'he'; frontWord.dir = 'rtl';
        frontWord.style.cssText = 'font-family:var(--font-hebrew);font-size:calc(var(--he-scale)*2rem);font-weight:700;direction:rtl;text-align:center;line-height:1.2;color:var(--text-primary);';
      } else {
        frontWord.style.cssText = 'font:600 2rem var(--font-display);color:var(--text-primary);text-align:center;line-height:1.2;';
      }
      frontWord.textContent = frontText;
      front.appendChild(frontWord);

      // Tap hint
      const hint = document.createElement('p');
      hint.style.cssText = 'position:absolute;bottom:var(--sp-4);font:400 var(--text-xs) var(--font-body);color:var(--text-muted);opacity:.5;';
      hint.textContent = 'toca para girar';
      front.appendChild(hint);

      // Back face
      const back = document.createElement('div');
      back.className = 'card-back';
      back.style.cssText = 'position:relative;background:var(--blue-900);border-radius:var(--radius-xl);';

      const wmBack = document.createElement('span');
      wmBack.setAttribute('aria-hidden', 'true');
      wmBack.style.cssText = 'position:absolute;font-family:var(--font-hebrew);font-size:min(40vw,180px);opacity:.06;color:#fff;pointer-events:none;user-select:none;line-height:1;';
      wmBack.textContent = 'א';
      back.appendChild(wmBack);
      back.appendChild(buildBack());

      // Swipe overlay
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:absolute;inset:0;border-radius:var(--radius-xl);pointer-events:none;opacity:0;transition:opacity 80ms;display:flex;align-items:center;justify-content:center;z-index:10;font:700 var(--text-xl) var(--font-body);';

      card.appendChild(front);
      card.appendChild(back);
      card.appendChild(overlay);
      scene.appendChild(card);
      el.appendChild(scene);

      // Qualify buttons
      const btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:var(--sp-3);padding:0 var(--sp-4);';

      const btnShow = document.createElement('button');
      btnShow.style.cssText = 'flex:1;height:48px;border-radius:var(--radius-pill);background:var(--blue-700);color:#fff;font:600 var(--text-sm) var(--font-body);cursor:pointer;border:none;transition:background var(--dur-fast);';
      btnShow.textContent = 'Mostrar respuesta';
      btnShow.setAttribute('aria-label', 'Mostrar respuesta');
      btnShow.addEventListener('mouseenter', () => { btnShow.style.background = 'var(--blue-800)'; });
      btnShow.addEventListener('mouseleave', () => { btnShow.style.background = 'var(--blue-700)'; });

      const btnWrong = document.createElement('button');
      btnWrong.style.cssText = 'display:none;flex:1;height:48px;border-radius:var(--radius-pill);border:1.5px solid var(--red);color:var(--red);background:transparent;font:600 var(--text-sm) var(--font-body);cursor:pointer;transition:background var(--dur-fast);justify-content:center;align-items:center;';
      btnWrong.textContent = 'No la sabía';
      btnWrong.setAttribute('aria-label', 'No sabía esta palabra');
      btnWrong.addEventListener('mouseenter', () => { btnWrong.style.background = 'var(--red-bg)'; });
      btnWrong.addEventListener('mouseleave', () => { btnWrong.style.background = 'transparent'; });

      const btnRight = document.createElement('button');
      btnRight.style.cssText = 'display:none;flex:1;height:48px;border-radius:var(--radius-pill);background:var(--blue-700);color:#fff;font:600 var(--text-sm) var(--font-body);cursor:pointer;border:none;transition:background var(--dur-fast);justify-content:center;align-items:center;';
      btnRight.textContent = 'La sabía';
      btnRight.setAttribute('aria-label', 'Sabía esta palabra');
      btnRight.addEventListener('mouseenter', () => { btnRight.style.background = 'var(--blue-800)'; });
      btnRight.addEventListener('mouseleave', () => { btnRight.style.background = 'var(--blue-700)'; });

      btnRow.appendChild(btnShow);
      btnRow.appendChild(btnWrong);
      btnRow.appendChild(btnRight);
      el.appendChild(btnRow);

      // --- INTERACTION LOGIC ---

      let isFlipped = false;
      let swipeStartX = 0, swipeStartY = 0;
      let qualified = false;  // T-03-06: prevents double-qualify

      function flipCard() {
        isFlipped = !isFlipped;
        card.classList.toggle('flipped', isFlipped);
        if (isFlipped) {
          btnShow.style.display = 'none';
          btnWrong.style.display = 'flex';
          btnRight.style.display = 'flex';
        }
      }

      function qualify(correct) {
        if (qualified) return;  // T-03-06: guard
        qualified = true;
        App.ui.updateProgress(word.id, correct);
        App.session.results.push({ wordId: word.id, correct });
        App.session.index++;
        scene.style.animation = (correct ? 'flash-green' : 'flash-red') + ' 300ms ease-out';
        scene.addEventListener('animationend', () => {
          scene.style.animation = '';
          App.ui.renderTarjetas(el);
        }, { once: true });
        // Fallback for prefers-reduced-motion (animation may not fire)
        setTimeout(() => {
          if (qualified && App.session.index > idx) App.ui.renderTarjetas(el);
        }, 350);
      }

      // Tap to flip
      card.addEventListener('click', (e) => {
        if (Math.abs(e.clientX - swipeStartX) < 5) flipCard();
      });
      card.addEventListener('keydown', e => {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
      });

      // Touch swipe (FLAS-04)
      card.addEventListener('touchstart', e => {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
      }, { passive: true });

      card.addEventListener('touchmove', e => {
        if (!isFlipped) return;
        const dx = e.touches[0].clientX - swipeStartX;
        const dy = e.touches[0].clientY - swipeStartY;
        if (Math.abs(dx) < Math.abs(dy)) return;  // vertical scroll — ignore
        const t = Math.min(Math.abs(dx) / 120, 1);
        if (dx > 0) {
          overlay.style.background = 'rgba(26,122,66,.18)';
          overlay.style.color = 'var(--green)';
          overlay.textContent = '✓ La sé';
        } else {
          overlay.style.background = 'rgba(196,43,43,.18)';
          overlay.style.color = 'var(--red)';
          overlay.textContent = '✗ No la sé';
        }
        overlay.style.opacity = t;
      }, { passive: true });

      card.addEventListener('touchend', e => {
        overlay.style.opacity = 0;
        if (!isFlipped) return;
        const dx = e.changedTouches[0].clientX - swipeStartX;
        if (Math.abs(dx) > 60) qualify(dx > 0);
      }, { passive: true });

      // Keyboard (FLAS-05: Space=flip, ArrowRight=sabe, ArrowLeft=no sabe)
      function onKey(e) {
        if (e.key === 'ArrowRight' && isFlipped) { e.preventDefault(); qualify(true);  }
        if (e.key === 'ArrowLeft'  && isFlipped) { e.preventDefault(); qualify(false); }
        if (e.key === ' ')          { e.preventDefault(); flipCard(); }
      }
      document.addEventListener('keydown', onKey);
      // T-03-05: remove keyboard listener when screen is replaced
      const observer = new MutationObserver(() => {
        if (!el.isConnected) { document.removeEventListener('keydown', onKey); observer.disconnect(); }
      });
      observer.observe(document.getElementById('app-main'), { childList: true });

      btnShow.addEventListener('click', () => flipCard());
      btnWrong.addEventListener('click', () => qualify(false));
      btnRight.addEventListener('click', () => qualify(true));
    };


    /* === 6. ROUTER === */

    App.router = {
      current: { route: 'inicio', params: {} },

      _parseHash(hash) {
        // '#/inicio?cat=Verbos' → { route: 'inicio', params: { cat: 'Verbos' } }
        const withoutHash = (hash || '#/inicio').replace(/^#\/?/, '');
        const [routePart, queryPart] = withoutHash.split('?');
        const route = routePart || 'inicio';
        const params = {};
        if (queryPart) {
          queryPart.split('&').forEach(pair => {
            const [k, v] = pair.split('=');
            if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
          });
        }
        return { route, params };
      },

      navigate(hash) {
        const parsed = App.router._parseHash(hash);
        App.router.current = parsed;

        // Update nav active state
        document.querySelectorAll('.nav-item').forEach(el => {
          const r = el.dataset.route;
          const studyRoutes = ['sesion','tarjetas','opcion-multiple','unir','completar','concordancia','escribir','clasificar','contrarreloj'];
          let active = false;
          if (r === 'sesion')        active = studyRoutes.includes(parsed.route);
          else if (r === 'estadisticas')  active = parsed.route === 'estadisticas';
          else if (r === 'configuracion') active = parsed.route === 'configuracion';
          else if (r === 'diccionario')   active = parsed.route === 'diccionario';
          else if (r === 'inicio')        active = parsed.route === 'inicio';
          el.classList.toggle('active', active);
        });

        // Page transition: add leave class to current content
        const main = document.getElementById('app-main');
        const existing = main.firstElementChild;
        if (existing) {
          existing.classList.add('page-leave');
          existing.addEventListener('animationend', () => {
            App.router._renderScreen(parsed, main);
          }, { once: true });
          // Fallback for reduced-motion (animation may not fire)
          setTimeout(() => {
            if (main.firstElementChild === existing) {
              App.router._renderScreen(parsed, main);
            }
          }, 250);
        } else {
          App.router._renderScreen(parsed, main);
        }
      },

      _renderScreen(parsed, main) {
        main.innerHTML = '';
        const screenEl = document.createElement('div');
        screenEl.className = 'screen active page-enter';

        const renderers = {
          inicio:           () => App.ui.renderInicio(screenEl),
          diccionario:      () => App.ui.renderDiccionario(screenEl),
          sesion:           () => App.ui.renderSesion(screenEl),
          tarjetas:         () => App.ui.renderTarjetas(screenEl),
          'opcion-multiple':() => App.ui.renderOpcionMultiple(screenEl),
          resultado:        () => App.ui.renderResultado(screenEl),
          'unir':           () => App.ui.renderUnir(screenEl),
        };

        const stubs = ['completar','concordancia',
                       'escribir','clasificar','contrarreloj','estadisticas','configuracion'];
        if (renderers[parsed.route]) {
          renderers[parsed.route]();
        } else if (stubs.includes(parsed.route)) {
          App.ui.renderStub(screenEl, parsed.route);
        } else {
          App.ui.renderInicio(screenEl); // fallback
        }

        main.appendChild(screenEl);
      },

      init() {
        window.addEventListener('hashchange', () => {
          App.router.navigate(window.location.hash);
        });
        const hash = window.location.hash || '#/inicio';
        if (!window.location.hash) history.replaceState(null, '', '#/inicio');
        App.router.navigate(hash);
      }
    };

    /* === 8. OPCION MULTIPLE SCREEN (SPEC §4.4, MCQ-01..04) === */

    /**
     * Returns 3 distractor words for the MCQ question.
     * Priority: same kind + same cat. For countries: same group (region) first.
     * Fallback: same kind any cat → any word. Never duplicates correct word's visible text.
     * MCQ-01, MCQ-02
     * @param {Object} correct - the correct word
     * @param {'es-he'|'he-es'} dir - resolved direction
     * @returns {Object[]} array of 3 distractor word objects
     */
    function getDistractors(correct, dir) {
      function getText(w) { return dir === 'es-he' ? w.msg : w.es; }
      const usedTexts = new Set([getText(correct)]);

      function isValid(w) {
        if (w.id === correct.id) return false;
        const t = getText(w);
        if (!t || usedTexts.has(t)) return false;
        return true;
      }

      function pickN(pool, n) {
        const result = [];
        const arr = pool.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        for (const w of arr) {
          if (result.length >= n) break;
          if (!isValid(w)) continue;
          usedTexts.add(getText(w));
          result.push(w);
        }
        return result;
      }

      const vocab = App.state.vocab;
      let distractors = [];

      if (correct.kind === 'country' && correct.group) {
        // Same region first (MCQ-02)
        distractors = pickN(vocab.filter(w => w.kind === 'country' && w.group === correct.group), 3);
      }

      if (distractors.length < 3) {
        // Same kind + same cat
        distractors = distractors.concat(pickN(vocab.filter(w => w.kind === correct.kind && w.cat === correct.cat), 3 - distractors.length));
      }

      if (distractors.length < 3) {
        // Same kind, any cat
        distractors = distractors.concat(pickN(vocab.filter(w => w.kind === correct.kind), 3 - distractors.length));
      }

      if (distractors.length < 3) {
        // Final fallback: any word
        distractors = distractors.concat(pickN(vocab, 3 - distractors.length));
      }

      return distractors.slice(0, 3);
    }

    App.ui.renderOpcionMultiple = function(el) {
      if (!App.session || !App.session.words || App.session.words.length === 0) {
        location.hash = '#/sesion'; return;
      }
      if (App.session.index >= App.session.words.length) {
        App.ui.renderResultado(el); return;
      }

      const total = App.session.words.length;
      const idx   = App.session.index;
      const word  = App.session.words[idx];
      const pct   = (idx / total) * 100;

      // Resolve direction
      const dir = App.session.direction === 'mezclada'
        ? (Math.random() < 0.5 ? 'es-he' : 'he-es')
        : App.session.direction;
      App.session._cardDir = dir;

      function getOptionText(w) { return dir === 'es-he' ? (w.msg || '?') : w.es; }
      const questionText = dir === 'es-he' ? word.es : (word.msg || word.es);
      const questionIsHe = dir === 'he-es';

      // 1 correct + 3 distractors, shuffled
      const distractors = getDistractors(word, dir);
      const options = [{ word, correct: true }, ...distractors.map(w => ({ word: w, correct: false }))];
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }

      let answered = false;

      el.innerHTML = '';

      // Progress bar (DESIGN.md §3.7)
      const progBar = document.createElement('div');
      progBar.className = 'session-progress';
      const progFill = document.createElement('div');
      progFill.className = 'session-progress-fill';
      progFill.style.width = pct + '%';
      progBar.appendChild(progFill);
      el.appendChild(progBar);

      // Counter
      const counter = document.createElement('p');
      counter.style.cssText = 'text-align:center;font:600 var(--text-sm) var(--font-body);color:var(--text-muted);padding:var(--sp-6) var(--sp-4) var(--sp-3);';
      counter.textContent = (idx + 1) + ' / ' + total;
      el.appendChild(counter);

      // Question
      const qSection = document.createElement('section');
      qSection.style.cssText = 'padding:0 var(--sp-4);margin-bottom:var(--sp-5);';
      const qEl = document.createElement('p');
      qEl.style.cssText = 'font:600 1.5rem var(--font-display);color:var(--text-primary);text-align:center;line-height:1.3;';
      if (questionIsHe) {
        qEl.lang = 'he'; qEl.dir = 'rtl';
        qEl.style.fontFamily = 'var(--font-hebrew)';
        qEl.style.fontSize = 'calc(var(--he-scale)*1.5rem)';
      }
      qEl.textContent = questionText;  // textContent — XSS safe (T-03-07)
      qSection.appendChild(qEl);
      el.appendChild(qSection);

      // Options grid 2x2 (DESIGN.md §3.2)
      if (!document.getElementById('mcq-grid-style')) {
        const s = document.createElement('style');
        s.id = 'mcq-grid-style';
        s.textContent = '@media (max-width:320px) { .mcq-grid { grid-template-columns:1fr !important; } }';
        document.head.appendChild(s);
      }
      const grid = document.createElement('div');
      grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);padding:0 var(--sp-4);margin-bottom:var(--sp-5);';
      grid.classList.add('mcq-grid');

      const optionEls = [];

      options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.style.cssText = 'position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);min-height:64px;padding:var(--sp-4) var(--sp-3) var(--sp-4) var(--sp-8);text-align:left;cursor:pointer;transition:border-color var(--dur-fast),background var(--dur-fast);font:400 var(--text-sm) var(--font-body);color:var(--text-primary);';
        btn.setAttribute('aria-label', 'Opcion ' + (i + 1) + ': ' + getOptionText(opt.word));

        // Shortcut chip (DESIGN.md §3.2: chip blue-100/blue-700)
        const chip = document.createElement('span');
        chip.setAttribute('aria-hidden', 'true');
        chip.style.cssText = 'position:absolute;top:var(--sp-2);left:var(--sp-2);width:18px;height:18px;background:var(--blue-100);color:var(--blue-700);border-radius:3px;font:600 var(--text-xs) var(--font-body);display:flex;align-items:center;justify-content:center;font-size:0.65rem;';
        chip.textContent = i + 1;
        btn.appendChild(chip);

        // Option text
        const textEl = document.createElement('span');
        if (dir === 'es-he') {
          textEl.lang = 'he'; textEl.dir = 'rtl';
          textEl.style.cssText = 'font-family:var(--font-hebrew);font-size:calc(var(--he-scale)*0.95rem);direction:rtl;display:block;text-align:right;';
        } else {
          textEl.style.cssText = 'font:400 var(--text-sm) var(--font-body);';
        }
        textEl.textContent = getOptionText(opt.word);  // textContent — XSS safe (T-03-07)
        btn.appendChild(textEl);

        btn.addEventListener('mouseenter', () => { if (!answered) { btn.style.borderColor = 'var(--blue-600)'; btn.style.background = 'var(--blue-50)'; } });
        btn.addEventListener('mouseleave', () => { if (!answered) { btn.style.borderColor = 'var(--border)'; btn.style.background = 'var(--surface)'; } });
        btn.addEventListener('click', () => handleAnswer(i, opt.correct));
        optionEls.push(btn);
        grid.appendChild(btn);
      });

      el.appendChild(grid);

      // "Siguiente" button — hidden until answered
      const nextBtn = document.createElement('button');
      nextBtn.style.cssText = 'display:none;width:calc(100% - var(--sp-8));margin:0 var(--sp-4);padding:var(--sp-3) var(--sp-4);background:var(--blue-700);color:#fff;border-radius:var(--radius-md);font:700 var(--text-base) var(--font-body);border:none;cursor:pointer;transition:background var(--dur-fast);';
      nextBtn.textContent = 'Siguiente';
      nextBtn.setAttribute('aria-label', 'Siguiente pregunta');
      nextBtn.addEventListener('mouseenter', () => { nextBtn.style.background = 'var(--blue-800)'; });
      nextBtn.addEventListener('mouseleave', () => { nextBtn.style.background = 'var(--blue-700)'; });
      nextBtn.addEventListener('click', advance);
      el.appendChild(nextBtn);

      function handleAnswer(chosenIdx, isCorrect) {
        if (answered) return;  // T-03-08: double-answer guard
        answered = true;

        App.ui.updateProgress(word.id, isCorrect);
        App.session.results.push({ wordId: word.id, correct: isCorrect });

        // Apply visual feedback (DESIGN.md §3.2, MCQ-03)
        options.forEach((opt, i) => {
          const btn = optionEls[i];
          btn.style.cursor = 'default';
          if (opt.correct) {
            btn.style.background  = 'var(--green-bg)';
            btn.style.borderColor = 'var(--green)';
            btn.style.color       = 'var(--green)';
          } else if (i === chosenIdx && !isCorrect) {
            btn.style.background  = 'var(--red-bg)';
            btn.style.borderColor = 'var(--red)';
            btn.style.color       = 'var(--red)';
          } else {
            btn.style.opacity       = '.45';
            btn.style.pointerEvents = 'none';
          }
        });

        // Flash/shake on question (DESIGN.md §3.6)
        qSection.style.animation = isCorrect ? 'flash-green 350ms ease-out' : 'shake 300ms ease-out';
        qSection.addEventListener('animationend', () => { qSection.style.animation = ''; }, { once: true });

        // Show all forms of correct word (MCQ-03)
        const formsPanel = document.createElement('div');
        formsPanel.style.cssText = 'padding:var(--sp-3) var(--sp-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);margin:var(--sp-3) var(--sp-4) 0;';
        const formsTitle = document.createElement('p');
        formsTitle.style.cssText = 'font:600 var(--text-xs) var(--font-body);color:var(--text-muted);margin-bottom:var(--sp-2);text-transform:uppercase;letter-spacing:.04em;';
        formsTitle.textContent = word.es;
        formsPanel.appendChild(formsTitle);
        const formsTable = document.createElement('table');
        formsTable.style.cssText = 'width:100%;border-collapse:collapse;font-size:calc(var(--he-scale)*0.875rem);';
        function addFormRow(label, val) {
          if (!val) return;
          const tr = document.createElement('tr');
          const tdL = document.createElement('td');
          tdL.style.cssText = 'padding:2px 0;color:var(--text-muted);font-size:var(--text-xs);width:60px;';
          tdL.lang = 'he'; tdL.dir = 'rtl'; tdL.style.fontFamily = 'var(--font-hebrew)';
          tdL.textContent = label;
          const tdV = document.createElement('td');
          tdV.style.cssText = 'padding:2px 0;text-align:right;';
          tdV.lang = 'he'; tdV.dir = 'rtl'; tdV.style.fontFamily = 'var(--font-hebrew)';
          tdV.textContent = val;
          tr.appendChild(tdL); tr.appendChild(tdV); formsTable.appendChild(tr);
        }
        if      (word.kind === 'noun')     { addFormRow('יחיד', word.msg); if (word.mpl && word.mpl !== word.msg) addFormRow('רבים', word.mpl); }
        else if (word.kind === 'gendered') { addFormRow('יחיד', word.msg); addFormRow('יחידה', word.fsg); if (word.mpl !== word.msg) addFormRow('רבים', word.mpl); addFormRow('רבות', word.fpl); }
        else if (word.kind === 'verb')     { addFormRow('פועל', word.msg); }
        else if (word.kind === 'country')  { addFormRow('מדינה', word.msg); if (word.group) addFormRow('אזור', word.group); }
        else                               { addFormRow('ביטוי', word.msg); }
        formsPanel.appendChild(formsTable);
        el.insertBefore(formsPanel, nextBtn);

        nextBtn.style.display = 'block';
      }

      function advance() {
        App.session.index++;
        App.ui.renderOpcionMultiple(el);
      }

      // Keyboard shortcuts (MCQ-04: 1-4 choose, Enter advance)
      function onKey(e) {
        if (e.key >= '1' && e.key <= '4') {
          const i = parseInt(e.key, 10) - 1;
          if (i < options.length) { e.preventDefault(); if (!answered) handleAnswer(i, options[i].correct); }
        }
        if (e.key === 'Enter') { e.preventDefault(); if (answered) advance(); }
      }
      document.addEventListener('keydown', onKey);
      // Cleanup keyboard listener when screen leaves DOM (T-03-10)
      const observer = new MutationObserver(() => {
        if (!el.isConnected) { document.removeEventListener('keydown', onKey); observer.disconnect(); }
      });
      observer.observe(document.getElementById('app-main'), { childList: true });
    };

    /* === 7c. UNIR CON FLECHAS (SPEC §4.5, MATC-01..04) === */

    App.ui.renderUnir = function(el) {
      if (!App.session || !App.session.words || App.session.words.length === 0) {
        location.hash = '#/sesion'; return;
      }
      if (App.session.index >= App.session.words.length) {
        App.ui.renderResultado(el); return;
      }

      const roundIndex  = Math.floor(App.session.index / 6) + 1;
      const totalRounds = Math.ceil(App.session.words.length / 6);
      const batchStart  = App.session.index;
      const batchEnd    = Math.min(batchStart + 6, App.session.words.length);
      const pairs       = App.session.words.slice(batchStart, batchEnd);
      const t0          = Date.now();
      let roundErrors   = 0;
      let resolved      = 0;

      // tap-tap state
      let selectedLeft  = null;  // { el, wordId }
      let selectedRight = null;  // { el, wordId } — kept for right-only deselect

      function shuffleArr(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      const leftPairs  = shuffleArr(pairs);
      const rightPairs = shuffleArr(pairs);

      // Determine text for each side per variant
      const variant = App.session._matchVariant || 'es-he';
      function getLeftText(w)  { return variant === 'es-he' ? w.es : w.msg; }
      function getRightText(w) {
        if (variant === 'sg-pl')    return w.mpl || '';
        if (variant === 'masc-fem') return w.fsg || '';
        return w.msg;
      }
      // Right side is Hebrew for es-he; both sides Hebrew for sg-pl and masc-fem
      function leftIsHebrew()  { return variant !== 'es-he'; }
      function rightIsHebrew() { return true; }

      // Build DOM
      el.innerHTML = '';

      const totalWords = App.session.words.length;
      const pct = totalWords > 0 ? Math.round((batchStart / totalWords) * 100) : 0;
      const progBar  = document.createElement('div');
      progBar.className = 'session-progress';
      const progFill = document.createElement('div');
      progFill.className = 'session-progress-fill';
      progFill.style.width = pct + '%';
      progBar.appendChild(progFill);
      el.appendChild(progBar);

      const counter = document.createElement('p');
      counter.style.cssText = 'text-align:center;font:600 var(--text-sm) var(--font-body);color:var(--text-muted);padding:var(--sp-6) var(--sp-4) var(--sp-3);';
      counter.textContent = 'Ronda ' + roundIndex + ' · ' + pairs.length + ' pares';
      el.appendChild(counter);

      const columnsWrap = document.createElement('div');
      columnsWrap.style.cssText = 'position:relative;display:flex;gap:var(--sp-3);padding:0 var(--sp-3) var(--sp-4);';
      el.appendChild(columnsWrap);

      const leftCol  = document.createElement('div');
      leftCol.style.cssText  = 'flex:1;display:flex;flex-direction:column;gap:var(--sp-2);';
      const rightCol = document.createElement('div');
      rightCol.style.cssText = 'flex:1;display:flex;flex-direction:column;gap:var(--sp-2);';
      columnsWrap.appendChild(leftCol);
      columnsWrap.appendChild(rightCol);

      function makeItem(word, side, textContent, isHebrew) {
        const btn = document.createElement('button');
        btn.dataset.wordId = word.id;
        btn.dataset.side   = side;
        btn.style.cssText  = 'width:100%;padding:var(--sp-3) var(--sp-2);border:2px solid var(--border);border-radius:var(--radius-md);background:var(--surface);cursor:pointer;transition:border-color var(--dur-fast),background var(--dur-fast);text-align:center;font:600 var(--text-sm) var(--font-body);color:var(--text-primary);';
        btn.textContent = textContent;  // textContent — no innerHTML (T-04-01)
        if (isHebrew) {
          btn.lang = 'he'; btn.dir = 'rtl';
          btn.style.fontFamily = 'var(--font-hebrew)';
          btn.style.fontSize   = 'calc(var(--he-scale)*1rem)';
        }
        return btn;
      }

      for (const w of leftPairs)  leftCol.appendChild(makeItem(w,  'left',  getLeftText(w),  leftIsHebrew()));
      for (const w of rightPairs) rightCol.appendChild(makeItem(w, 'right', getRightText(w), rightIsHebrew()));

      // SVG overlay
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;';
      columnsWrap.appendChild(svg);

      const resolvedPairs = {};  // wordId → { leftEl, rightEl, color }
      const lines = {};          // wordId → <line>
      let pendingLine = null;    // { leftEl, rightEl, line, color }

      function drawLine(leftEl, rightEl, color) {
        const cr   = columnsWrap.getBoundingClientRect();
        const r1   = leftEl.getBoundingClientRect();
        const r2   = rightEl.getBoundingClientRect();
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', r1.left + r1.width  / 2 - cr.left);
        line.setAttribute('y1', r1.top  + r1.height / 2 - cr.top);
        line.setAttribute('x2', r2.left + r2.width  / 2 - cr.left);
        line.setAttribute('y2', r2.top  + r2.height / 2 - cr.top);
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', '2.5');
        line.setAttribute('stroke-linecap', 'round');
        svg.appendChild(line);
        return line;
      }

      function redrawLines() {
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        for (const wid of Object.keys(resolvedPairs)) {
          const { leftEl, rightEl, color } = resolvedPairs[wid];
          lines[wid] = drawLine(leftEl, rightEl, color);
        }
        if (pendingLine && pendingLine.leftEl && pendingLine.rightEl) {
          pendingLine.line = drawLine(pendingLine.leftEl, pendingLine.rightEl, pendingLine.color);
        }
      }

      const onResize = () => redrawLines();
      window.addEventListener('resize', onResize);

      function evaluatePair(leftEl, leftWordId, rightEl, rightWordId) {
        const isCorrect = leftWordId === rightWordId;
        const color     = isCorrect ? 'var(--green)' : 'var(--red)';
        const lineEl    = drawLine(leftEl, rightEl, color);
        if (isCorrect) {
          [leftEl, rightEl].forEach(e => {
            e.style.opacity       = '0.45';
            e.style.borderColor   = 'var(--green)';
            e.style.background    = 'var(--green-bg)';
            e.dataset.resolved    = 'true';
            e.style.pointerEvents = 'none';
            e.style.animation     = 'flash-green 350ms ease-out';
            e.addEventListener('animationend', () => { e.style.animation = ''; }, { once: true });
          });
          resolvedPairs[leftWordId] = { leftEl, rightEl, color: 'var(--green)' };
          lines[leftWordId] = lineEl;
          if (!variant || variant === 'es-he') App.ui.updateProgress(leftWordId, true);
          App.session.results.push({ wordId: leftWordId, correct: true });
          resolved++;
          selectedLeft = null; selectedRight = null;
          if (resolved >= pairs.length) showRoundSummary();
        } else {
          roundErrors++;
          [leftEl, rightEl].forEach(e => {
            e.style.borderColor = 'var(--red)';
            e.style.background  = 'var(--red-bg)';
            e.style.animation   = 'shake 400ms ease-out';
          });
          if (!variant || variant === 'es-he') App.ui.updateProgress(leftWordId, false);
          App.session.results.push({ wordId: leftWordId, correct: false });
          pendingLine = { leftEl, rightEl, line: lineEl, color: 'var(--red)' };
          selectedLeft = null; selectedRight = null;
          setTimeout(() => {
            [leftEl, rightEl].forEach(e => {
              e.style.borderColor = 'var(--border)';
              e.style.background  = 'var(--surface)';
              e.style.animation   = '';
            });
            if (lineEl.parentNode) lineEl.parentNode.removeChild(lineEl);
            pendingLine = null;
          }, 450);
        }
      }

      function handleTap(clickedEl) {
        const wordId = clickedEl.dataset.wordId;
        const side   = clickedEl.dataset.side;
        if (clickedEl.dataset.resolved === 'true') return;

        if (side === 'left') {
          if (selectedRight) {
            // Right was selected first — evaluate pair right→left
            const r = selectedRight;
            selectedRight = null;
            evaluatePair(clickedEl, wordId, r.el, r.wordId);
            return;
          }
          if (selectedLeft && selectedLeft.el === clickedEl) {
            clickedEl.style.borderColor = 'var(--border)';
            clickedEl.style.background  = 'var(--surface)';
            selectedLeft = null;
            return;
          }
          if (selectedLeft) {
            selectedLeft.el.style.borderColor = 'var(--border)';
            selectedLeft.el.style.background  = 'var(--surface)';
          }
          selectedLeft = { el: clickedEl, wordId };
          clickedEl.style.borderColor = 'var(--blue-700)';
          clickedEl.style.background  = 'var(--blue-50, #EFF6FF)';
        } else {
          if (selectedLeft) {
            evaluatePair(selectedLeft.el, selectedLeft.wordId, clickedEl, wordId);
            return;
          }
          if (selectedRight && selectedRight.el === clickedEl) {
            clickedEl.style.borderColor = 'var(--border)';
            clickedEl.style.background  = 'var(--surface)';
            selectedRight = null;
          } else {
            if (selectedRight) { selectedRight.el.style.borderColor = 'var(--border)'; selectedRight.el.style.background = 'var(--surface)'; }
            selectedRight = { el: clickedEl, wordId };
            clickedEl.style.borderColor = 'var(--blue-700)';
            clickedEl.style.background  = 'var(--blue-50, #EFF6FF)';
          }
        }
      }

      for (const btn of [...leftCol.children, ...rightCol.children]) {
        btn.addEventListener('click', () => handleTap(btn));
      }

      function showRoundSummary() {
        const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
        App.session.index = batchEnd;
        window.removeEventListener('resize', onResize);

        el.innerHTML = '';
        const summary = document.createElement('div');
        summary.style.cssText = 'padding:var(--sp-8) var(--sp-4);text-align:center;';

        const title = document.createElement('h2');
        title.style.cssText = 'font:600 var(--text-3xl) var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-4);';
        title.textContent = 'Ronda ' + roundIndex + ' completada';
        summary.appendChild(title);

        const stats = document.createElement('p');
        stats.style.cssText = 'font:600 var(--text-sm) var(--font-body);color:var(--text-muted);margin-bottom:var(--sp-6);';
        stats.textContent = elapsed + 's · ' + roundErrors + (roundErrors === 1 ? ' error' : ' errores');
        summary.appendChild(stats);

        const hasMore = App.session.index < App.session.words.length;
        const nextBtn = document.createElement('button');
        nextBtn.style.cssText = 'display:block;width:100%;padding:var(--sp-4);background:var(--blue-700);color:var(--text-on-primary);border-radius:var(--radius-lg);font:700 var(--text-lg) var(--font-body);border:none;cursor:pointer;transition:background var(--dur-fast);';
        nextBtn.textContent = hasMore ? 'Siguiente ronda' : 'Ver resultado';
        nextBtn.addEventListener('mouseenter', () => { nextBtn.style.background = 'var(--blue-800)'; });
        nextBtn.addEventListener('mouseleave', () => { nextBtn.style.background = 'var(--blue-700)'; });
        nextBtn.addEventListener('click', () => { App.ui.renderUnir(el); });
        summary.appendChild(nextBtn);
        el.appendChild(summary);
      }

      // Cleanup resize listener when screen leaves DOM
      const cleanupObserver = new MutationObserver(() => {
        if (!el.isConnected) {
          window.removeEventListener('resize', onResize);
          cleanupObserver.disconnect();
        }
      });
      cleanupObserver.observe(document.getElementById('app-main'), { childList: true });
    };

    // Stub renderer for unimplemented screens
    App.ui.renderStub = function(el, route) {
      const names = {
        'tarjetas': 'Tarjetas', 'opcion-multiple': 'Opción múltiple',
        'unir': 'Unir con flechas', 'completar': 'Completar la forma',
        'concordancia': 'Concordancia', 'escribir': 'Escribir',
        'clasificar': 'Clasificar', 'contrarreloj': 'Contrarreloj',
        'estadisticas': 'Estadísticas', 'configuracion': 'Configuración'
      };
      el.innerHTML = `
        <div style="padding: var(--sp-10) var(--sp-4); text-align: center; color: var(--text-muted);">
          <p style="font: 600 var(--text-lg) var(--font-display); color: var(--text-secondary); margin-bottom: var(--sp-3);">${names[route] || route}</p>
          <p style="font-size: var(--text-sm);">Disponible próximamente</p>
        </div>`;
    };

    /* === 7b. SELECTOR DE SESIÓN (SPEC §4.2) === */

    App.ui.renderSesion = function(el) {
      // Build category order and counts from vocab
      const catOrder = [];
      const catCounts = {};
      for (const w of App.state.vocab) {
        if (!catCounts[w.cat]) { catOrder.push(w.cat); catCounts[w.cat] = 0; }
        catCounts[w.cat]++;
      }

      // Load last session from localStorage — validate all fields (T-05-01)
      const savedSettings = Store.get('ivrit.v1.settings') || {};
      const raw = (savedSettings.lastSession && typeof savedSettings.lastSession === 'object') ? savedSettings.lastSession : {};
      const VALID_FILTERS    = ['todas', 'nuevas', 'dificiles', 'hoy'];
      const VALID_DIRECTIONS = ['es-he', 'he-es', 'mezclada'];
      const VALID_QUANTITIES = [10, 20, 30, 0];
      const VALID_VARIANTS   = ['es-he', 'sg-pl', 'masc-fem'];
      const state = {
        cats:         (Array.isArray(raw.cats) && raw.cats.every(c => typeof c === 'string')) ? raw.cats : catOrder.slice(),
        filter:       VALID_FILTERS.includes(raw.filter)         ? raw.filter       : 'todas',
        direction:    VALID_DIRECTIONS.includes(raw.direction)   ? raw.direction    : 'es-he',
        quantity:     VALID_QUANTITIES.includes(raw.quantity)    ? raw.quantity     : 10,
        matchVariant: VALID_VARIANTS.includes(raw.matchVariant)  ? raw.matchVariant : 'es-he'
      };

      function saveState() {
        const settings = Store.get('ivrit.v1.settings') || {};
        settings.lastSession = { cats: state.cats.slice(), filter: state.filter, direction: state.direction, quantity: state.quantity, matchVariant: state.matchVariant };
        Store.set('ivrit.v1.settings', settings);
      }

      function getMatchingWords() {
        const selected = state.cats.length === 0 ? catOrder : state.cats;
        let words = App.state.vocab.filter(w => selected.includes(w.cat));
        const now = Date.now();
        const sevenDaysAgo = now - 7 * 24 * 60 * 60 * 1000;
        if (state.filter === 'nuevas') {
          words = words.filter(w => !App.state.progress[w.id] || App.state.progress[w.id].box === 0);
        } else if (state.filter === 'dificiles') {
          words = words.filter(w => {
            const p = App.state.progress[w.id];
            if (!p) return true; // unstarted = box 0 = difícil
            return p.box <= 2 || (p.lastWrong && p.lastWrong >= sevenDaysAgo);
          });
        } else if (state.filter === 'hoy') {
          words = words.filter(w => {
            const p = App.state.progress[w.id];
            return p && p.box > 0 && p.due <= now;
          });
        }
        return words;
      }

      function rerender() {
        saveState();
        App.ui.renderSesion(el);
      }

      const matching = getMatchingWords();
      const qty = state.quantity === 0 ? matching.length : state.quantity;
      const hasEnough = matching.length >= Math.min(qty, 1);
      const isInsufficient = state.quantity !== 0 && matching.length < state.quantity && matching.length > 0;

      // Build chip HTML helper
      function chip(label, selected, onclick, extraStyle) {
        const base = `border-radius:var(--radius-pill);padding:6px 14px;font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:36px;transition:background var(--dur-fast),border-color var(--dur-fast);`;
        const style = selected
          ? base + 'background:var(--blue-700);color:#fff;border:1.5px solid transparent;'
          : base + 'background:transparent;color:var(--text-secondary);border:1.5px solid var(--border);' + (extraStyle || '');
        return `<button onclick="${onclick}" style="${style}" aria-pressed="${selected}">${label}</button>`;
      }

      el.innerHTML = `
        <div class="screen-sesion">
          <header style="margin-bottom:var(--sp-5);">
            <h1 style="font:600 var(--text-4xl) var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-2);">Nueva sesión</h1>
            <p style="font-size:var(--text-sm);color:var(--text-muted);">Elige qué estudiar hoy</p>
          </header>

          <!-- Categories -->
          <section style="margin-bottom:var(--sp-6);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-3);">
              <h2 style="font:600 1.125rem var(--font-display);color:var(--text-primary);">Categorías</h2>

    /* === 8. DICCIONARIO: SEARCH NORMALIZATION === */

    function normalizeSearch(str) {
      if (!str) return '';
      return String(str)
        .replace(/[֑-ׇ]/g, '')   // strip Hebrew niqqud/cantillation
        .normalize('NFD').replace(/[̀-ͯ]/g, '')  // strip Spanish accents
        .toLowerCase()
        .trim();
    }


    /* === 9. DICCIONARIO SCREEN (SPEC §4.12) === */

    App.ui.renderDiccionario = function(el) {
      // Group words by category, preserving original order from vocab
      const catOrder = [];
      const catMap = {};
      for (const w of App.state.vocab) {
        if (!catMap[w.cat]) { catMap[w.cat] = []; catOrder.push(w.cat); }
        catMap[w.cat].push(w);
      }

      // Column definitions per word kind
      const kindCols = {
        verb:     { cols: ['es','msg'],            heads: ['Español','<span lang="he" dir="rtl">פועל</span>'] },
        expr:     { cols: ['es','msg'],            heads: ['Español','<span lang="he" dir="rtl">ביטוי</span>'] },
        country:  { cols: ['es','msg','group'],    heads: ['Español','<span lang="he" dir="rtl">מדינה</span>','<span lang="he" dir="rtl">אזור</span>'] },
        gendered: { cols: ['es','msg','fsg','mpl','fpl'], heads: ['Español','<span lang="he" dir="rtl">יחיד</span>','<span lang="he" dir="rtl">יחידה</span>','<span lang="he" dir="rtl">רבים</span>','<span lang="he" dir="rtl">רבות</span>'] },
        noun:     { cols: ['es','msg','mpl'],      heads: ['Español','<span lang="he" dir="rtl">יחיד</span>','<span lang="he" dir="rtl">רבים</span>'] }
      };
      const heFields = new Set(['msg','fsg','mpl','fpl','group']);

      function renderWordTable(words) {
        if (!words.length) return '';
        const { cols, heads } = kindCols[words[0].kind] || kindCols.noun;
        const thRow = heads.map((h, i) =>
          `<th style="padding:var(--sp-2) var(--sp-3);text-align:${i===0?'left':'right'};font:600 var(--text-xs) var(--font-body);color:var(--text-muted);border-bottom:2px solid var(--border);white-space:nowrap;">${h}</th>`
        ).join('');
        const tbRows = words.map(w => {
          const box = (App.state.progress[w.id] && App.state.progress[w.id].box) || 0;
          const cells = cols.map(col => {
            const val = w[col];
            if (col === 'es') {
              return `<td style="padding:var(--sp-2) var(--sp-3);font-size:var(--text-sm);color:var(--text-primary);border-bottom:1px solid var(--border);">${val||'—'} <span class="box-chip" data-box="${box}">${box}</span></td>`;
            }
            if (heFields.has(col) && val) {
              return `<td style="padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border);text-align:right;">` +
                `<span class="he" lang="he" dir="rtl" style="font-size:calc(var(--he-scale)*0.875rem);">${val}</span>` +
                ` <button onclick="App.ui.showToast('Audio disponible en fases futuras')" aria-label="Pronunciar" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:0.875rem;vertical-align:middle;">🔊</button></td>`;
            }
            return `<td style="padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border);color:var(--text-secondary);font-size:var(--text-sm);text-align:${heFields.has(col)?'right':'left'};">${val||'—'}</td>`;
          }).join('');
          return `<tr>${cells}</tr>`;
        }).join('');
        return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;"><table style="width:100%;border-collapse:collapse;font-size:var(--text-sm);"><thead><tr>${thRow}</tr></thead><tbody>${tbRows}</tbody></table></div>`;
      }

      function renderResults(query) {
        const norm = normalizeSearch(query);
        if (!norm) {
          // Default: all categories collapsed
          return catOrder.map(cat => {
            const words = catMap[cat];
            return `<details class="dict-cat" style="border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:var(--sp-3);overflow:hidden;">
              <summary style="padding:var(--sp-4);cursor:pointer;font:600 1rem var(--font-display);color:var(--text-primary);display:flex;justify-content:space-between;align-items:center;list-style:none;user-select:none;background:var(--surface);">
                <span>${cat}</span>
                <span style="font:400 var(--text-sm) var(--font-body);color:var(--text-muted);">${words.length} palabras</span>
              </summary>
              <div style="padding:0 var(--sp-1) var(--sp-2);">${renderWordTable(words)}</div>
            </details>`;
          }).join('');
        }
        // Search mode: flat list grouped by category heading
        const matched = [];
        for (const cat of catOrder) {
          const hits = catMap[cat].filter(w =>
            normalizeSearch(w.es).includes(norm)  ||
            normalizeSearch(w.msg).includes(norm) ||
            normalizeSearch(w.fsg).includes(norm) ||
            normalizeSearch(w.mpl).includes(norm) ||
            normalizeSearch(w.fpl).includes(norm)
          );
          if (hits.length) matched.push({ cat, hits });
        }
        if (!matched.length) {
          // T-04-01: escape query via textContent before inserting into DOM
          const safe = document.createElement('span');
          safe.textContent = query;
          return `<div style="padding:var(--sp-10) var(--sp-4);text-align:center;">
            <p style="color:var(--text-muted);margin-bottom:var(--sp-4);">Sin resultados para "<strong>${safe.innerHTML}</strong>"</p>
            <button onclick="document.getElementById('dict-search').value='';App.ui._dictUpdate('')"
              style="padding:var(--sp-2) var(--sp-5);border:1.5px solid var(--border);border-radius:var(--radius-pill);background:transparent;color:var(--text-secondary);font:600 var(--text-sm) var(--font-body);cursor:pointer;min-height:44px;">
              Limpiar búsqueda
            </button>
          </div>`;
        }
        return matched.map(({ cat, hits }) =>
          `<div style="margin-bottom:var(--sp-5);">
            <h3 style="font:600 1rem var(--font-display);color:var(--text-primary);padding:var(--sp-2) 0;border-bottom:1px solid var(--border);margin-bottom:var(--sp-2);">${cat}</h3>
            ${renderWordTable(hits)}
          </div>`
        ).join('');
      }

      el.innerHTML = `
        <div class="screen-diccionario">
          <header style="margin-bottom:var(--sp-5);">
            <h1 style="font:600 var(--text-4xl) var(--font-display);color:var(--text-primary);margin-bottom:var(--sp-4);">Diccionario</h1>
            <div style="position:relative;">

                oninput="App.ui._dictUpdate(this.value)"
                style="width:100%;padding:var(--sp-3) var(--sp-4) var(--sp-3) calc(var(--sp-4) + 20px);border:1.5px solid var(--border);border-radius:var(--radius-pill);background:var(--surface);color:var(--text-primary);font:400 var(--text-base) var(--font-body);outline:none;transition:border-color var(--dur-fast);min-height:44px;"
                onfocus="this.style.borderColor='var(--blue-700)'" onblur="this.style.borderColor='var(--border)'"
                aria-label="Buscar palabras">
              <svg style="position:absolute;left:var(--sp-4);top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
          </header>
          <div id="dict-results">${renderResults('')}</div>
          <div style="height:var(--sp-8);"></div>
        </div>`;

      App.ui._dictUpdate = function(query) {
        document.getElementById('dict-results').innerHTML = renderResults(query);
      };
    };
